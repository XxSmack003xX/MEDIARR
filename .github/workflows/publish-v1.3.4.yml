name: Publish MEDIARR v1.3.4

on:
  push:
    branches:
      - main
    paths:
      - '.publish-v1.3.4.trigger'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean v1.3.4 source
        uses: actions/checkout@v6
        with:
          ref: 513a30a2cd85e0ef00d9847f934d99b9aba88e4f
          fetch-depth: 0

      - name: Validate hotfix
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.3.4"
          test "$(git rev-parse HEAD)" = "513a30a2cd85e0ef00d9847f934d99b9aba88e4f"
          node --check server.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for fn in ('public/index.html','public/mobile.html'):
              text=Path(fn).read_text()
              scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>', text, re.S)
              body='\n'.join(s for s in scripts if s.strip())
              p=Path('/tmp')/(Path(fn).name+'.js')
              p.write_text(body)
              subprocess.run(['node','--check',str(p)],check=True)
          PY
          grep -q "TMDB_NEGATIVE_TTL_MS = 10000" public/index.html
          grep -q "scheduleTmdbRecheck(root)" public/index.html
          grep -q "card.dataset.tmdbkey='series:'" public/index.html
          grep -q "TMDB_NEGATIVE_TTL_M = 10000" public/mobile.html
          grep -q "scheduleTmdbRecheckM()" public/mobile.html
          grep -q "tmdbAddedM.set(k,true)" public/mobile.html

      - name: Create v1.3.4 tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.3.4"
          TARGET="513a30a2cd85e0ef00d9847f934d99b9aba88e4f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/v$VERSION" | awk '{print $1}')"
            test "$REMOTE_SHA" = "$TARGET"
          else
            git tag "v$VERSION" "$TARGET"
            git push origin "v$VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push release image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg MEDIARR_VERSION="$VERSION" \
            --build-arg MEDIARR_REPOSITORY="$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Build release ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/mediarr-$VERSION/public"
          cp package.json server.js update-helper.js README.md CHANGELOG.md SECURITY.md Caddyfile.example Dockerfile docker-entrypoint.sh docker-compose.yml "dist/mediarr-$VERSION/"
          cp public/index.html public/mobile.html "dist/mediarr-$VERSION/public/"
          cat > "dist/mediarr-$VERSION/docker-compose.release.yml" <<YAML
          services:
            mediarr:
              image: $IMAGE:$VERSION
              container_name: mediarr
              init: true
              restart: unless-stopped
              ports:
                - "7575:7575"
              environment:
                PORT: 7575
                HOST: 0.0.0.0
                DATA_DIR: /data
                SESSION_HOURS: ${SESSION_HOURS:-1}
                DOCKER_SOCKET: /var/run/docker.sock
              volumes:
                - ./data:/data
                - ${DOCKER_SOCKET_HOST:-/var/run/docker.sock}:/var/run/docker.sock
              extra_hosts:
                - "host.docker.internal:host-gateway"
          YAML
          (cd dist && zip -qr "mediarr-$VERSION.zip" "mediarr-$VERSION")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "dist/mediarr-$VERSION.zip" --clobber
          else
            gh release create "v$VERSION" "dist/mediarr-$VERSION.zip" \
              --title "MEDIARR v$VERSION" \
              --generate-notes
          fi
