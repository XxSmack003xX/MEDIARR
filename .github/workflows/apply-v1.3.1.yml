name: Apply MEDIARR v1.3.1

on:
  push:
    branches:
      - main
    paths:
      - '.apply-v1.3.1.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct and verify tested patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v131/patch* > /tmp/v131.patch.gz.b64
          test "$(wc -c < /tmp/v131.patch.gz.b64)" -eq 23484
          base64 -d /tmp/v131.patch.gz.b64 | gzip -d > /tmp/v131.patch
          echo "0efa230a7df0942c295e00022c2d0042495ff0cdfe433e72cf3159fba3da26a2  /tmp/v131.patch" | sha256sum -c -

      - name: Apply v1.3.1 changes
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 --batch --forward --fuzz=3 < /tmp/v131.patch
          git diff --check

      - name: Verify backend and frontend syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check update-helper.js
          python3 - <<'PY'
          import re, pathlib
          for src, out in [('public/index.html','/tmp/desktop.js'),('public/mobile.html','/tmp/mobile.js')]:
              text=pathlib.Path(src).read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S|re.I)
              pathlib.Path(out).write_text('\n'.join(scripts))
          PY
          node --check /tmp/desktop.js
          node --check /tmp/mobile.js
          node -e "const p=require('./package.json'); if(p.version!=='1.3.1'){console.error(p.version);process.exit(1)}"
          grep -q "/api/admin/transcodes" server.js
          grep -q "/api/webdav/playback-plan" server.js
          grep -q "Automatic playback selection" README.md

      - name: Commit verified v1.3.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/index.html public/mobile.html README.md CHANGELOG.md package.json Dockerfile docs/PUBLISHING.md
          git commit -m "MEDIARR v1.3.1: automatic playback and transcode dashboard"
          git push origin HEAD:main
