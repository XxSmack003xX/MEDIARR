name: Apply MEDIARR v1.3.1 source update

on:
  push:
    branches:
      - main
    paths:
      - '.apply-v1.3.1.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply tested v1.3.1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v131.patch.gz.b64 <<'B64'
          [...TRUNCATED FOR TOOL CALL...]
          B64
          tr -d '[:space:]' < /tmp/v131.patch.gz.b64 | base64 -d | gzip -d > /tmp/v131.patch
          patch -p1 --batch --forward --fuzz=3 < /tmp/v131.patch
          git diff --check

      - name: Verify backend and frontend syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check update-helper.js
          python3 - <<'PY'
          import re, pathlib
          for src, out in [('public/index.html','/tmp/desktop.js'),('public/mobile.html','/tmp/mobile.js')]:
              text=pathlib.Path(src).read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S|re.I)
              pathlib.Path(out).write_text('\n'.join(scripts))
          PY
          node --check /tmp/desktop.js
          node --check /tmp/mobile.js
          node -e "const p=require('./package.json'); if(p.version!=='1.3.1') process.exit(1)"

      - name: Commit v1.3.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/index.html public/mobile.html README.md CHANGELOG.md package.json Dockerfile docs/PUBLISHING.md
          git commit -m "MEDIARR v1.3.1: automatic playback and transcode dashboard"
          git push origin HEAD:main
