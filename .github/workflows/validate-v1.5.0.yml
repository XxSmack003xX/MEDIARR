name: Validate MEDIARR v1.5.0

on:
  push:
    branches:
      - main
    paths:
      - '.validate-v1.5.0.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.5.0"
          node --check server.js
          node --check public/v140.js
          node --check public/v150.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for fn in ('public/index.html','public/mobile.html'):
              text=Path(fn).read_text()
              assert '<script src="/v150.js"></script>' in text
              assert 'unifiedMediaDetail' in text
              scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>', text, re.S)
              body='\n'.join(s for s in scripts if s.strip())
              p=Path('/tmp')/(Path(fn).name+'.js')
              p.write_text(body)
              subprocess.run(['node','--check',str(p)],check=True)
          PY
          grep -q "public/v150.js" .github/workflows/release.yml
          grep -q "## 1.5.0" CHANGELOG.md
          grep -q "## Unified media detail" README.md

      - name: Integration validation with mock media services
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/mock_media.py <<'PY'
          import json, threading, urllib.parse
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          MOVIE={
            "id":1,"title":"Mock Movie","year":2026,"imdbId":"tt1234567","tmdbId":111,
            "monitored":True,"hasFile":True,"sizeOnDisk":5368709120,"path":"/movies/Mock Movie (2026)",
            "rootFolderPath":"/movies","qualityProfileId":5,"status":"released","minimumAvailability":"released",
            "movieFile":{
              "relativePath":"Mock.Movie.2026.mkv","path":"/movies/Mock Movie (2026)/Mock.Movie.2026.mkv",
              "size":5368709120,"dateAdded":"2026-09-19T20:00:00Z","releaseGroup":"MOCK","edition":"Director Cut",
              "quality":{"quality":{"name":"Bluray-1080p"}},"languages":[{"name":"English"}],
              "mediaInfo":{"videoCodec":"x265","videoDynamicRange":"HDR10","videoBitDepth":10,"videoFps":23.976,
                "resolution":"1920x1080","audioCodec":"EAC3","audioChannels":6,"audioStreamCount":2,
                "audioLanguages":"English / Spanish","subtitles":"English / Spanish"}
            }
          }
          SERIES={
            "id":2,"title":"Mock Show","year":2026,"imdbId":"tt7654321","tvdbId":222,
            "monitored":True,"path":"/tv/Mock Show","rootFolderPath":"/tv","qualityProfileId":6,
            "status":"continuing","seriesType":"standard",
            "statistics":{"episodeCount":3,"episodeFileCount":1,"sizeOnDisk":2147483648}
          }
          EPISODES=[
            {"id":21,"seriesId":2,"seasonNumber":1,"episodeNumber":1,"title":"Pilot","monitored":True,"hasFile":True,"airDateUtc":"2026-01-01T00:00:00Z"},
            {"id":22,"seriesId":2,"seasonNumber":1,"episodeNumber":2,"title":"Missing","monitored":True,"hasFile":False,"airDateUtc":"2026-01-08T00:00:00Z"},
            {"id":23,"seriesId":2,"seasonNumber":1,"episodeNumber":3,"title":"Future","monitored":True,"hasFile":False,"airDateUtc":"2099-01-15T00:00:00Z"}
          ]
          EPFILES=[{
            "id":31,"seriesId":2,"size":2147483648,"quality":{"quality":{"name":"WEBDL-1080p"}},
            "languages":[{"name":"English"}],
            "mediaInfo":{"videoCodec":"x264","videoDynamicRange":"SDR","audioCodec":"AAC","subtitles":"English"}
          }]

          class H(BaseHTTPRequestHandler):
            def sendj(self,obj,code=200):
              data=json.dumps(obj).encode()
              self.send_response(code);self.send_header("Content-Type","application/json");self.send_header("Content-Length",str(len(data)));self.end_headers();self.wfile.write(data)
            def log_message(self,*a): pass
            def do_GET(self):
              port=self.server.server_port
              u=urllib.parse.urlparse(self.path); p=u.path; q=urllib.parse.parse_qs(u.query)
              if port==17878:
                if p=="/api/v3/movie": return self.sendj([MOVIE])
                if p=="/api/v3/movie/1": return self.sendj(MOVIE)
                if p=="/api/v3/system/status": return self.sendj({"version":"6.0.0","instanceName":"Mock Radarr"})
                if p=="/api/v3/qualityprofile": return self.sendj([{"id":5,"name":"HD"}])
                if p=="/api/v3/rootfolder": return self.sendj([{"path":"/movies","freeSpace":999999999}])
              if port==18989:
                if p=="/api/v3/series": return self.sendj([SERIES])
                if p=="/api/v3/series/2": return self.sendj(SERIES)
                if p=="/api/v3/episode": return self.sendj(EPISODES)
                if p=="/api/v3/episodefile": return self.sendj(EPFILES)
                if p=="/api/v3/system/status": return self.sendj({"version":"4.0.0","instanceName":"Mock Sonarr"})
                if p=="/api/v3/qualityprofile": return self.sendj([{"id":6,"name":"TV HD"}])
                if p=="/api/v3/rootfolder": return self.sendj([{"path":"/tv","freeSpace":999999999}])
              if port==13240:
                if p=="/identity": return self.sendj({"MediaContainer":{"machineIdentifier":"mock-machine"}})
                if p=="/search":
                  title=(q.get("query") or [""])[0].lower()
                  if "show" in title:
                    return self.sendj({"MediaContainer":{"Metadata":[{"ratingKey":"200","key":"/library/metadata/200","type":"show","title":"Mock Show","year":2026,"viewCount":0,"Guid":[{"id":"imdb://tt7654321"},{"id":"tvdb://222"}]}]}})
                  return self.sendj({"MediaContainer":{"Metadata":[{"ratingKey":"100","key":"/library/metadata/100","type":"movie","title":"Mock Movie","year":2026,"viewCount":1,"Guid":[{"id":"imdb://tt1234567"},{"id":"tmdb://111"}]}]}})
                if p=="/hubs/search": return self.sendj({"MediaContainer":{"Hub":[]}})
              return self.sendj({"message":"not found"},404)

          servers=[]
          for port in (17878,18989,13240):
            srv=ThreadingHTTPServer(("127.0.0.1",port),H);servers.append(srv)
            threading.Thread(target=srv.serve_forever,daemon=True).start()
          threading.Event().wait()
          PY
          python3 /tmp/mock_media.py >/tmp/mock_media.log 2>&1 &
          MOCK_PID=$!

          export DATA_DIR="$RUNNER_TEMP/mediarr-v150-data"
          export HOST=127.0.0.1
          export PORT=17575
          mkdir -p "$DATA_DIR"
          node server.js >/tmp/mediarr-v150.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID $MOCK_PID >/dev/null 2>&1 || true; cat /tmp/mediarr-v150.log || true; cat /tmp/mock_media.log || true' EXIT

          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:$PORT/api/setup-needed" >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS -c /tmp/mediarr.cookie -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"testpass123"}' \
            "http://127.0.0.1:$PORT/api/setup" >/dev/null

          curl -fsS -b /tmp/mediarr.cookie -H 'Content-Type: application/json' -X POST \
            -d '{"radarr":{"url":"http://127.0.0.1:17878","apiKey":"rad","qualityProfileId":5,"rootFolderPath":"/movies"},"sonarr":{"url":"http://127.0.0.1:18989","apiKey":"son","qualityProfileId":6,"rootFolderPath":"/tv"},"plex":{"url":"http://127.0.0.1:13240","token":"plex"}}' \
            "http://127.0.0.1:$PORT/api/config" >/tmp/cfg.json

          curl -fsS -b /tmp/mediarr.cookie \
            "http://127.0.0.1:$PORT/api/media/detail?type=movie&title=Mock%20Movie&year=2026&imdbId=tt1234567&tmdbId=111" >/tmp/movie.json
          node - <<'NODE'
          const d=require('/tmp/movie.json');
          if(!d.ok || !d.arr.inLibrary || d.arr.id!==1) throw new Error('movie Radarr merge failed');
          if(!d.media || !d.media.hasFile || d.media.file.video.codec!=='x265') throw new Error('movie file metadata failed');
          if(d.media.file.video.dynamicRange!=='HDR10' || d.media.file.audio.codec!=='EAC3') throw new Error('movie tech metadata failed');
          if(!d.plex || !d.plex.available || !/mock-machine/.test(d.plex.webUrl||'')) throw new Error('movie Plex availability failed');
          if(d.plex.viewCount!==1) throw new Error('movie Plex watched state failed');
          NODE

          curl -fsS -b /tmp/mediarr.cookie \
            "http://127.0.0.1:$PORT/api/media/detail?type=series&title=Mock%20Show&year=2026&imdbId=tt7654321&tvdbId=222" >/tmp/show.json
          node - <<'NODE'
          const d=require('/tmp/show.json');
          if(!d.ok || !d.arr.inLibrary || d.arr.id!==2) throw new Error('series Sonarr merge failed');
          if(!d.tv || d.tv.episodes.total!==3 || d.tv.episodes.downloaded!==1 || d.tv.episodes.missing!==1) throw new Error('episode summary failed');
          if(!d.tv.episodes.next || d.tv.episodes.next.episodeNumber!==3) throw new Error('next episode failed');
          if(d.tv.files.count!==1 || !d.tv.files.videoCodecs.includes('x264') || !d.tv.files.audioCodecs.includes('AAC')) throw new Error('episode file metadata failed');
          if(!d.tv.seasons.length || d.tv.seasons[0].downloaded!==1) throw new Error('season summary failed');
          if(!d.plex || !d.plex.available || d.plex.ratingKey!=='200') throw new Error('series Plex availability failed');
          NODE

          kill $APP_PID $MOCK_PID
          wait $APP_PID || true
          wait $MOCK_PID || true
          trap - EXIT
