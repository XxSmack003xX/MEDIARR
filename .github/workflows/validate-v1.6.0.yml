name: Validate MEDIARR v1.6.0

on:
  push:
    branches:
      - main
    paths:
      - '.validate-v1.6.0.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.6.0"
          node --check server.js
          node --check public/v140.js
          node --check public/v150.js
          node --check public/v160.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for fn in ('public/index.html','public/mobile.html'):
              text=Path(fn).read_text()
              assert '<script src="/v160.js"></script>' in text
              assert 'MEDIARRUserHome.show' in text
              scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>', text, re.S)
              body='\n'.join(s for s in scripts if s.strip())
              p=Path('/tmp')/(Path(fn).name+'.js')
              p.write_text(body)
              subprocess.run(['node','--check',str(p)],check=True)
          PY
          grep -q "public/v160.js" .github/workflows/release.yml
          grep -q "## 1.6.0" CHANGELOG.md
          grep -q "## User home pages" README.md

      - name: Personalized home integration + isolation
        shell: bash
        run: |
          set -euo pipefail

          cat >/tmp/mock_home.py <<'PY'
          import json, threading, urllib.parse
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          RADARR=[
            {"id":1,"title":"Admin Movie","sortTitle":"Admin Movie","year":2026,"imdbId":"tt1000001","tmdbId":101,
             "monitored":True,"hasFile":True,"sizeOnDisk":3000000000,"added":"2026-09-19T18:00:00Z",
             "images":[{"coverType":"poster","remoteUrl":"https://example.invalid/admin-movie.jpg"}]},
            {"id":2,"title":"Shared Movie","sortTitle":"Shared Movie","year":2026,"imdbId":"tt1000002","tmdbId":102,
             "monitored":True,"hasFile":True,"sizeOnDisk":2000000000,"added":"2026-09-18T18:00:00Z",
             "images":[{"coverType":"poster","remoteUrl":"https://example.invalid/shared-movie.jpg"}]}
          ]
          SONARR=[
            {"id":11,"title":"Admin Show","sortTitle":"Admin Show","year":2026,"imdbId":"tt2000011","tvdbId":211,
             "monitored":True,"status":"continuing","added":"2026-09-17T18:00:00Z",
             "images":[{"coverType":"poster","remoteUrl":"https://example.invalid/admin-show.jpg"}],
             "statistics":{"episodeCount":2,"episodeFileCount":1,"sizeOnDisk":1000000000}},
            {"id":12,"title":"Alice Show","sortTitle":"Alice Show","year":2026,"imdbId":"tt2000012","tvdbId":212,
             "monitored":True,"status":"continuing","added":"2026-09-19T19:00:00Z",
             "images":[{"coverType":"poster","remoteUrl":"https://example.invalid/alice-show.jpg"}],
             "statistics":{"episodeCount":2,"episodeFileCount":1,"sizeOnDisk":1100000000}}
          ]
          EPS={
            11:[
              {"id":111,"seriesId":11,"seasonNumber":1,"episodeNumber":1,"title":"Admin Pilot","monitored":True,"hasFile":True,"airDateUtc":"2026-01-01T00:00:00Z"},
              {"id":112,"seriesId":11,"seasonNumber":1,"episodeNumber":2,"title":"Admin Future","monitored":True,"hasFile":False,"airDateUtc":"2099-01-08T00:00:00Z"}
            ],
            12:[
              {"id":121,"seriesId":12,"seasonNumber":1,"episodeNumber":1,"title":"Alice Pilot","monitored":True,"hasFile":True,"airDateUtc":"2026-01-01T00:00:00Z"},
              {"id":122,"seriesId":12,"seasonNumber":1,"episodeNumber":2,"title":"Alice Future","monitored":True,"hasFile":False,"airDateUtc":"2099-02-08T00:00:00Z"}
            ]
          }

          def token(h):
            return h.headers.get('X-Plex-Token','')

          class H(BaseHTTPRequestHandler):
            def log_message(self,*a): pass
            def sendj(self,obj,code=200):
              b=json.dumps(obj).encode()
              self.send_response(code)
              self.send_header('Content-Type','application/json')
              self.send_header('Content-Length',str(len(b)))
              self.end_headers()
              self.wfile.write(b)
            def do_GET(self):
              p=urllib.parse.urlparse(self.path)
              q=urllib.parse.parse_qs(p.query)
              port=self.server.server_port

              if port==17878:
                if p.path=="/api/v3/movie": return self.sendj(RADARR)
                if p.path=="/api/v3/system/status": return self.sendj({"version":"6.0.0","instanceName":"Mock Radarr"})
                if p.path=="/api/v3/qualityprofile": return self.sendj([{"id":1,"name":"HD"}])
                if p.path=="/api/v3/rootfolder": return self.sendj([{"path":"/movies","freeSpace":999999999}])

              if port==18989:
                if p.path=="/api/v3/series": return self.sendj(SONARR)
                if p.path=="/api/v3/episode":
                  sid=int((q.get("seriesId") or [0])[0] or 0)
                  return self.sendj(EPS.get(sid,[]))
                if p.path=="/api/v3/system/status": return self.sendj({"version":"4.0.0","instanceName":"Mock Sonarr"})
                if p.path=="/api/v3/qualityprofile": return self.sendj([{"id":1,"name":"TV"}])
                if p.path=="/api/v3/rootfolder": return self.sendj([{"path":"/tv","freeSpace":999999999}])

              if port==13240:
                t=token(self)
                if p.path=="/identity":
                  return self.sendj({"MediaContainer":{"machineIdentifier":"mock-home-machine","version":"1.0"}})
                if p.path=="/status/sessions/history/all":
                  acct=(q.get("accountID") or [""])[0]
                  is_alice = acct=="2" or t=="alicetok"
                  title="Alice Watched" if is_alice else "Admin Watched"
                  return self.sendj({"MediaContainer":{"Metadata":[{
                    "ratingKey":"701" if is_alice else "700",
                    "key":"/library/metadata/701" if is_alice else "/library/metadata/700",
                    "guid":"plex://movie/"+("alice" if is_alice else "admin"),
                    "type":"movie","title":title,"year":2026,"viewedAt":1726780000,
                    "thumb":"/library/metadata/x/thumb",
                    "Guid":[{"id":"imdb://"+("tt9000002" if is_alice else "tt9000001")}]
                  }]}})
                if p.path=="/hubs/home/continueWatching":
                  is_alice=t=="alicetok"
                  title="Alice Continue" if is_alice else "Admin Continue"
                  return self.sendj({"MediaContainer":{"Metadata":[{
                    "ratingKey":"801" if is_alice else "800",
                    "key":"/library/metadata/801" if is_alice else "/library/metadata/800",
                    "guid":"plex://movie/"+("alicecontinue" if is_alice else "admincontinue"),
                    "type":"movie","title":title,"year":2026,"viewOffset":300000,"duration":600000,
                    "thumb":"/library/metadata/y/thumb"
                  }]}})
                if p.path=="/accounts":
                  return self.sendj({"MediaContainer":{"Account":[
                    {"id":1,"name":"AdminPlex"},{"id":2,"name":"AlicePlex"}
                  ]}})

              if port==13241:
                t=token(self)
                is_alice=t=="alicetok"
                title="Alice Watchlist" if is_alice else "Admin Watchlist"
                return self.sendj({"MediaContainer":{"totalSize":1,"Metadata":[{
                  "ratingKey":"901" if is_alice else "900",
                  "guid":"plex://movie/"+("alicewatch" if is_alice else "adminwatch"),
                  "type":"movie","title":title,"year":2026,
                  "thumb":"https://images.plex.tv/mock.jpg"
                }]}})

              return self.sendj({"message":"not found"},404)

          servers=[]
          for port in (17878,18989,13240,13241):
            srv=ThreadingHTTPServer(("127.0.0.1",port),H)
            servers.append(srv)
            threading.Thread(target=srv.serve_forever,daemon=True).start()
          threading.Event().wait()
          PY

          python3 /tmp/mock_home.py >/tmp/mock-home.log 2>&1 &
          MOCK_PID=$!

          export DATA_DIR="$RUNNER_TEMP/mediarr-v160-data"
          export HOST=127.0.0.1
          export PORT=17575
          export PLEX_DISCOVER_URL=http://127.0.0.1:13241
          mkdir -p "$DATA_DIR"

          node server.js >/tmp/mediarr-v160.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID $MOCK_PID >/dev/null 2>&1 || true; cat /tmp/mediarr-v160.log || true; cat /tmp/mock-home.log || true' EXIT

          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/api/setup-needed" >/dev/null; then break; fi
            sleep .25
          done

          curl -fsS -c /tmp/admin.cookie \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"testpass123"}' \
            "http://127.0.0.1:$PORT/api/setup" >/dev/null

          curl -fsS -b /tmp/admin.cookie \
            -H 'Content-Type: application/json' -X POST \
            -d '{"username":"alice","password":"alicepass123","role":"user","dailyLimit":7}' \
            "http://127.0.0.1:$PORT/api/admin/users" >/dev/null

          curl -fsS -b /tmp/admin.cookie \
            -H 'Content-Type: application/json' -X POST \
            -d '{"radarr":{"url":"http://127.0.0.1:17878","apiKey":"rad","qualityProfileId":1,"rootFolderPath":"/movies"},"sonarr":{"url":"http://127.0.0.1:18989","apiKey":"son","qualityProfileId":1,"rootFolderPath":"/tv"},"plex":{"url":"http://127.0.0.1:13240","token":"servertok"}}' \
            "http://127.0.0.1:$PORT/api/config" >/dev/null

          # Attach distinct Plex identities to each MEDIARR user.
          node - "$DATA_DIR/users.json" <<'NODE'
          const fs=require('fs'),p=process.argv[2],j=JSON.parse(fs.readFileSync(p,'utf8'));
          const a=j.users.find(x=>x.username==='admin'),b=j.users.find(x=>x.username==='alice');
          a.plex={token:'admintok',rootToken:'admintok',username:'AdminPlex',id:1,accountId:1,at:Date.now()};
          b.plex={token:'alicetok',rootToken:'alicetok',username:'AlicePlex',id:2,accountId:2,at:Date.now()};
          fs.writeFileSync(p,JSON.stringify(j,null,2));
          NODE

          # Give the two users deliberately different private home data.
          node - "$DATA_DIR/adds.json" "$DATA_DIR/favorites.json" <<'NODE'
          const fs=require('fs');
          fs.writeFileSync(process.argv[2],JSON.stringify({adds:[
            {ts:Date.now()-1000,username:'admin',role:'admin',service:'radarr',type:'movie',title:'Admin Movie',year:2026,ip:'127.0.0.1'},
            {ts:Date.now()-2000,username:'alice',role:'user',service:'sonarr',type:'series',title:'Alice Show',year:2026,ip:'127.0.0.1'}
          ]},null,2));
          fs.writeFileSync(process.argv[3],JSON.stringify({users:{
            admin:[{key:'tvdb:211',title:'Admin Show',imdbId:'tt2000011',tvdbId:211,tmdbId:null,poster:'https://example.invalid/admin-show.jpg',ts:Date.now()-1000}],
            alice:[{key:'tvdb:212',title:'Alice Show',imdbId:'tt2000012',tvdbId:212,tmdbId:null,poster:'https://example.invalid/alice-show.jpg',ts:Date.now()-1000}]
          }},null,2));
          NODE

          # Build the fresh library cache with added timestamps.
          curl -fsS -b /tmp/admin.cookie -X POST \
            "http://127.0.0.1:$PORT/api/admin/library/scan" >/dev/null
          sleep 1

          curl -fsS -c /tmp/alice.cookie \
            -H 'Content-Type: application/json' \
            -d '{"username":"alice","password":"alicepass123"}' \
            "http://127.0.0.1:$PORT/api/login" >/dev/null

          curl -fsS -b /tmp/admin.cookie "http://127.0.0.1:$PORT/api/home" >/tmp/admin-home.json
          curl -fsS -b /tmp/alice.cookie "http://127.0.0.1:$PORT/api/home" >/tmp/alice-home.json

          node - <<'NODE'
          const A=require('/tmp/admin-home.json'), B=require('/tmp/alice-home.json');
          const has=(arr,title)=>(arr||[]).some(x=>(x.title||x.show)===title);

          if(!A.ok||!B.ok) throw new Error('home endpoint failed');

          if(!has(A.requests,'Admin Movie') || has(A.requests,'Alice Show')) throw new Error('admin request isolation failed');
          if(!has(B.requests,'Alice Show') || has(B.requests,'Admin Movie')) throw new Error('alice request isolation failed');

          if(!has(A.favorites,'Admin Show') || has(A.favorites,'Alice Show')) throw new Error('admin favorites isolation failed');
          if(!has(B.favorites,'Alice Show') || has(B.favorites,'Admin Show')) throw new Error('alice favorites isolation failed');

          if(!has(A.plex.continueWatching,'Admin Continue') || has(A.plex.continueWatching,'Alice Continue')) throw new Error('admin continue-watching isolation failed');
          if(!has(B.plex.continueWatching,'Alice Continue') || has(B.plex.continueWatching,'Admin Continue')) throw new Error('alice continue-watching isolation failed');

          if(!has(A.plex.recentlyWatched,'Admin Watched') || has(A.plex.recentlyWatched,'Alice Watched')) throw new Error('admin Plex history isolation failed');
          if(!has(B.plex.recentlyWatched,'Alice Watched') || has(B.plex.recentlyWatched,'Admin Watched')) throw new Error('alice Plex history isolation failed');

          if(!has(A.plex.watchlist,'Admin Watchlist') || has(A.plex.watchlist,'Alice Watchlist')) throw new Error('admin watchlist isolation failed');
          if(!has(B.plex.watchlist,'Alice Watchlist') || has(B.plex.watchlist,'Admin Watchlist')) throw new Error('alice watchlist isolation failed');

          if(!has(A.upcoming,'Admin Show') || has(A.upcoming,'Alice Show')) throw new Error('admin upcoming isolation failed');
          if(!has(B.upcoming,'Alice Show') || has(B.upcoming,'Admin Show')) throw new Error('alice upcoming isolation failed');

          if(!has(A.recentlyAvailable,'Admin Movie') || !has(A.recentlyAvailable,'Alice Show')) throw new Error('shared recently available library missing expected items');

          if(B.user.username!=='alice' || B.user.dailyLimit!==7) throw new Error('home user summary failed');
          if(!B.plex.linked || B.plex.account!=='AlicePlex') throw new Error('linked Plex profile summary failed');
          NODE

          kill $APP_PID $MOCK_PID
          wait $APP_PID || true
          wait $MOCK_PID || true
          trap - EXIT
