name: Tag MEDIARR v1.3.2

on:
  push:
    branches:
      - main
    paths:
      - '.release-v1.3.2.trigger'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create exact v1.3.2 tag
        shell: bash
        run: |
          set -euo pipefail
          TARGET="96a4f81585b0bbc795903ea02f8895f0df6921d3"
          TAG="v1.3.2"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
            test "$REMOTE_SHA" = "$TARGET"
            echo "$TAG already points to the correct commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$TARGET"
            git push origin "$TAG"
          fi
