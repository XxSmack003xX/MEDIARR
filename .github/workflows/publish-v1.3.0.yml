name: Publish MEDIARR v1.3.0

on:
  push:
    branches:
      - main
    paths:
      - '.release-v1.3.0.trigger'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean v1.3.0 source
        uses: actions/checkout@v6
        with:
          ref: f4dff5370732b602c78da0123860bbf4f101270c
          fetch-depth: 0

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "1.3.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Create v1.3.0 tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/v$VERSION" | awk '{print $1}')"
            test "$REMOTE_SHA" = "f4dff5370732b602c78da0123860bbf4f101270c"
          else
            git tag "v$VERSION" f4dff5370732b602c78da0123860bbf4f101270c
            git push origin "v$VERSION"
          fi

      - name: Log in to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg MEDIARR_VERSION="$VERSION" \
            --build-arg MEDIARR_REPOSITORY="$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Build release ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/mediarr-$VERSION/public"
          cp package.json server.js update-helper.js README.md CHANGELOG.md SECURITY.md Caddyfile.example Dockerfile docker-entrypoint.sh docker-compose.yml "dist/mediarr-$VERSION/"
          cp public/index.html public/mobile.html "dist/mediarr-$VERSION/public/"
          cat > "dist/mediarr-$VERSION/docker-compose.release.yml" <<YAML
          services:
            mediarr:
              image: $IMAGE:$VERSION
              container_name: mediarr
              init: true
              restart: unless-stopped
              ports:
                - "7575:7575"
              environment:
                PORT: 7575
                HOST: 0.0.0.0
                DATA_DIR: /data
                SESSION_HOURS: ${SESSION_HOURS:-1}
                DOCKER_SOCKET: /var/run/docker.sock
              volumes:
                - ./data:/data
                - ${DOCKER_SOCKET_HOST:-/var/run/docker.sock}:/var/run/docker.sock
              extra_hosts:
                - "host.docker.internal:host-gateway"
          YAML
          (cd dist && zip -qr "mediarr-$VERSION.zip" "mediarr-$VERSION")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "dist/mediarr-$VERSION.zip" --clobber
          else
            gh release create "v$VERSION" "dist/mediarr-$VERSION.zip" \
              --title "MEDIARR v$VERSION" \
              --generate-notes
          fi
