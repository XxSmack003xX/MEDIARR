name: Publish MEDIARR v1.6.6

on:
  push:
    branches:
      - main
    paths:
      - '.publish-v1.6.6.trigger'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean v1.6.6 source
        uses: actions/checkout@v6
        with:
          ref: 4fda289edf1d1c2f7519c4b86e59aac364ae7062
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.6.6"
          TARGET="4fda289edf1d1c2f7519c4b86e59aac364ae7062"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$TARGET"
          grep -q "ARG MEDIARR_VERSION=$VERSION" Dockerfile
          grep -q "version-$VERSION-35c5f0" README.md
          grep -q "p === '/api/register'" server.js
          grep -q "p === '/api/auth/plex/pin'" server.js
          grep -q "p === '/api/auth/plex/check'" server.js
          grep -q "p === '/api/admin/registrations'" server.js
          grep -q "function userApproved" server.js
          grep -q "async function resolvePlexAccountMatch" server.js
          grep -q "authRegisterToggle" public/index.html
          grep -q "beginPlexAuthD" public/index.html
          grep -q "checkRegistrationNoticeD" public/index.html
          grep -q 'data-act="approve"' public/index.html
          grep -q "authRegisterToggleM" public/mobile.html
          grep -q "beginPlexAuthM" public/mobile.html
          grep -q "checkRegistrationNoticeM" public/mobile.html
          grep -q 'data-act="approve"' public/mobile.html
          node --check server.js
          node --check update-helper.js
          node --check public/v140.js
          node --check public/v150.js
          node --check public/v160.js
          grep -q 'public/v160.js' .github/workflows/release.yml
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Create v1.6.6 tag
        shell: bash
        run: |
          set -euo pipefail
          TARGET="4fda289edf1d1c2f7519c4b86e59aac364ae7062"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/v$VERSION" | awk '{print $1}')"
            test "$REMOTE_SHA" = "$TARGET"
          else
            git tag "v$VERSION" "$TARGET"
            git push origin "v$VERSION"
          fi

      - name: Log in to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push release image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg MEDIARR_VERSION="$VERSION" \
            --build-arg MEDIARR_REPOSITORY="$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Build release ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/mediarr-$VERSION/public"
          cp package.json server.js update-helper.js README.md CHANGELOG.md SECURITY.md Caddyfile.example Dockerfile docker-entrypoint.sh docker-compose.yml "dist/mediarr-$VERSION/"
          cp public/index.html public/mobile.html public/v140.js public/v150.js public/v160.js "dist/mediarr-$VERSION/public/"
          cat > "dist/mediarr-$VERSION/docker-compose.release.yml" <<YAML
          services:
            mediarr:
              image: $IMAGE:$VERSION
              container_name: mediarr
              init: true
              restart: unless-stopped
              ports:
                - "7575:7575"
              environment:
                PORT: 7575
                HOST: 0.0.0.0
                DATA_DIR: /data
                SESSION_HOURS: ${SESSION_HOURS:-1}
                DOCKER_SOCKET: /var/run/docker.sock
              volumes:
                - ./data:/data
                - ${DOCKER_SOCKET_HOST:-/var/run/docker.sock}:/var/run/docker.sock
              extra_hosts:
                - "host.docker.internal:host-gateway"
          YAML
          (cd dist && zip -qr "mediarr-$VERSION.zip" "mediarr-$VERSION")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "dist/mediarr-$VERSION.zip" --clobber
          else
            gh release create "v$VERSION" "dist/mediarr-$VERSION.zip" \
              --title "MEDIARR v$VERSION" \
              --generate-notes
          fi
