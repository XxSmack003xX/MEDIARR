name: Tag MEDIARR v1.3.1

on:
  push:
    branches:
      - main
    paths:
      - '.tag-v1.3.1.trigger'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create v1.3.1 tag on verified clean source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="0205667382d6b5bceef4aaddd224e2aa2da1845d"
          git show "$SOURCE:package.json" > /tmp/package.json
          node -e "const p=require('/tmp/package.json'); if(p.version!=='1.3.1'){console.error(p.version);process.exit(1)}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v1.3.1 >/dev/null 2>&1; then
            REMOTE="$(git ls-remote --tags origin refs/tags/v1.3.1 | awk '{print $1}')"
            test "$REMOTE" = "$SOURCE"
          else
            git tag v1.3.1 "$SOURCE"
            git push origin v1.3.1
          fi
