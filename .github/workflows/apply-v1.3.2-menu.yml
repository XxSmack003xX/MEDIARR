name: Apply MEDIARR v1.3.2 menu update

on:
  push:
    branches:
      - main
    paths:
      - '.update-v132/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Reconstruct verified update payload
        shell: bash
        run: |
          set -euo pipefail
          cat .update-v132/part* > /tmp/mediarr-v132.b64
          tr -d '[:space:]' < /tmp/mediarr-v132.b64 | base64 --decode > /tmp/mediarr-v132.zip
          echo "3afdeae5a6288dba8f70ed306d40f9bd898309fd183517aeccaec0dea2702b18  /tmp/mediarr-v132.zip" | sha256sum -c -
          unzip -oq /tmp/mediarr-v132.zip -d .

      - name: Validate updated source
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.3.2"
          node --check server.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for fn in ('public/index.html','public/mobile.html'):
              text = Path(fn).read_text()
              scripts = re.findall(r'<script(?: [^>]*)?>(.*?)</script>', text, re.S)
              body = '\n'.join(s for s in scripts if s.strip())
              p = Path('/tmp') / (Path(fn).name + '.js')
              p.write_text(body)
              subprocess.run(['node','--check',str(p)], check=True)
          PY
          grep -q 'id="sideNav"' public/index.html
          grep -q 'id="menuToggle"' public/index.html
          grep -q '## 1.3.2' CHANGELOG.md
          grep -q '## Desktop navigation drawer' README.md

      - name: Commit clean v1.3.2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .update-v132
          rm -f .github/workflows/apply-v1.3.2-menu.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MEDIARR v1.3.2: redesign desktop navigation"
          git push origin HEAD:main
