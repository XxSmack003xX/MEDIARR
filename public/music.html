<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>try{document.documentElement.setAttribute('data-theme', localStorage.getItem('mediarr-theme')||'dark');}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0b0e">
<meta name="application-name" content="MEDIARR Music">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music">
<link rel="icon" type="image/svg+xml" href="/icons/mediarr-icon.svg">
<link rel="apple-touch-icon" href="/icons/mediarr-icon-192.png">
<title>Music · MEDIARR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  :root{
    --bg:#0c0b0e;--bg2:#141217;--panel:#1a171e;--panel2:#221d28;--line:#2e2834;--hover:rgba(255,255,255,.05);
    --txt:#ece7f2;--muted:#9a90a8;--gold:#e8b04b;--gold-dim:#b9893a;--on-gold:#17120a;--green:#4ade80;--red:#f4607a;
    --shadow:0 18px 50px -12px rgba(0,0,0,.7);
    --side:236px;--bar:84px;--tabs:0px;--mini:0px;
    --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  }
  html[data-theme="light"]{
    --bg:#f4f2f8;--bg2:#eae4f1;--panel:#ffffff;--panel2:#f3eef9;--line:#e0d9ea;--hover:rgba(40,20,70,.05);
    --txt:#211c2a;--muted:#6c6480;--gold:#a9762a;--gold-dim:#8a6023;--on-gold:#fff;--green:#2c9a58;--red:#cf3d5c;
    --shadow:0 16px 40px -16px rgba(70,50,100,.30);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font:14px/1.45 'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  a{color:inherit}
  svg{flex:none}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .hidden{display:none!important}
  .muted{color:var(--muted)}
  .wordmark{font-family:'Bebas Neue','Arial Narrow','Roboto Condensed',sans-serif;letter-spacing:1px;font-weight:400}
  .wordmark b{color:var(--gold);font-weight:400}

  /* ---------- layout ---------- */
  #app{position:fixed;inset:0;display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:minmax(0,1fr) var(--bar)}
  #side{grid-row:1;grid-column:1;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #main{grid-row:1;grid-column:2;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;scroll-behavior:auto}
  #bar{grid-column:1 / -1;grid-row:2;background:var(--bg2);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);align-items:center;gap:16px;padding:0 18px;z-index:20}

  .side-head{padding:18px 18px 10px;display:flex;align-items:center;gap:10px}
  .side-head a{text-decoration:none;display:flex;align-items:baseline;gap:8px;border-radius:8px}
  .side-head .wordmark{font-size:28px;line-height:1}
  .side-head .tag{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
  .search{position:relative;margin:4px 14px 10px}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;outline:none;min-height:40px}
  .search input:focus{border-color:var(--gold)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .side-scroll{overflow-y:auto;flex:1;padding:0 8px 16px}
  .side-title{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px;display:flex;align-items:center;justify-content:space-between}
  .side-title button{color:var(--muted);border-radius:6px;padding:2px;display:flex}
  .side-title button:hover{color:var(--gold)}
  .nav{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:9px;font-weight:700;color:var(--txt);text-align:left;min-height:38px;text-decoration:none}
  .nav svg{color:var(--muted)}
  .nav:hover{background:var(--hover)}
  .nav.on{background:var(--panel2);color:var(--gold)}
  .nav.on svg{color:var(--gold)}
  .nav span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-foot{border-top:1px solid var(--line);padding:10px 8px}

  /* ---------- views ---------- */
  .view{padding:26px 32px 40px;max-width:1500px}
  .vhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .vhead h1{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
  .vhead .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .vhead .grow{flex:1;min-width:0}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:9px 16px;font-weight:800;font-size:13px;border:1px solid var(--line);background:var(--panel);min-height:40px;white-space:nowrap}
  .btn:hover{border-color:var(--gold);color:var(--gold)}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
  .btn.primary:hover{filter:brightness(1.08);color:var(--on-gold)}
  .btn.danger:hover{border-color:var(--red);color:var(--red)}
  .btn.sm{padding:6px 12px;min-height:34px;font-size:12px}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;color:var(--txt)}
  .iconbtn:hover{background:var(--hover);color:var(--gold)}
  .iconbtn.on{color:var(--gold)}
  select.sel{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;min-height:40px;font-weight:700;font-size:13px}
  .section{margin:30px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .section h2{font-size:19px;font-weight:800}
  .section a,.section button.link{color:var(--gold);font-weight:700;font-size:13px;text-decoration:none}
  .empty{padding:60px 20px;text-align:center;color:var(--muted);max-width:560px;margin:0 auto}
  .empty h2{color:var(--txt);font-size:20px;margin:14px 0 8px}
  .empty p{margin-bottom:16px}
  .empty svg{color:var(--gold);opacity:.8}

  /* album grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:22px 18px}
  .row-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:172px;gap:18px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
  .card{min-width:0;cursor:pointer;border-radius:12px;position:relative}
  .card .cover{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px -10px rgba(0,0,0,.6)}
  .card .cover .play{position:absolute;right:9px;bottom:9px;width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(6px);transition:.15s;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .card:hover .cover .play,.card:focus-within .cover .play{opacity:1;transform:none}
  .card .t{font-weight:800;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .a{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .badge{position:absolute;left:8px;top:8px;font-size:9.5px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;background:rgba(0,0,0,.66);color:#fff;border-radius:6px;padding:3px 6px}
  .art{width:100%;aspect-ratio:1;display:block;object-fit:cover;background:var(--panel2)}
  .ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75)}
  .round .cover,.round .art,.round .ph{border-radius:50%}
  .card.round .t,.card.round .a{text-align:center}

  /* track tables */
  .tracks{width:100%;border-collapse:collapse;table-layout:fixed}
  .tracks th{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2;white-space:nowrap}
  .tracks th.sortable{cursor:pointer}
  .tracks th.sortable:hover,.tracks th.sorted{color:var(--gold)}
  .tracks td{padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid transparent}
  .tracks tr.tr{cursor:default}
  .tracks tr.tr:hover td{background:var(--hover)}
  .tracks tr.tr td:first-child{border-radius:8px 0 0 8px}
  .tracks tr.tr td:last-child{border-radius:0 8px 8px 0}
  .tracks tr.playing td{color:var(--gold)}
  .tracks tr.sel td{background:var(--panel2)}
  .tracks .num{width:52px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .tracks .num .eq{display:none}
  .tracks tr.playing .num .n{display:none}
  .tracks tr.playing .num .eq{display:inline-flex}
  .tracks tr.tr:hover .num .n{display:none}
  .tracks tr.tr:hover .num .pbtn{display:inline-flex}
  .tracks .num .pbtn{display:none;color:var(--txt);width:28px;height:28px;align-items:center;justify-content:center;margin-left:auto;border-radius:6px}
  .tracks tr.playing:hover .num .eq{display:none}
  .tracks .time{width:64px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .tracks .more{width:44px;text-align:right}
  .tracks .more button{opacity:.0;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
  .tracks tr:hover .more button,.tracks .more button:focus-visible{opacity:1}
  .tracks .more button:hover{color:var(--gold);background:var(--hover)}
  .tracks .ttl{font-weight:700}
  .tracks .ttl small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
  .tracks tr.playing .ttl small{color:var(--gold-dim)}
  .tracks .mini{width:46px;padding-right:0}
  .tracks .mini .art,.tracks .mini .ph{width:36px;height:36px;border-radius:6px}
  .tracks .c-plays{width:70px;text-align:right;color:var(--muted)}
  .disc{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:18px 10px 6px!important}
  .eq{gap:2px;align-items:flex-end;height:14px;justify-content:flex-end;width:100%}
  .eq i{width:3px;background:var(--gold);border-radius:1px;animation:eq 1s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
  @keyframes eq{0%,100%{height:3px}50%{height:14px}}
  body.paused .eq i{animation:none;height:4px}
  @media (prefers-reduced-motion:reduce){.eq i{animation:none;height:8px}}
  .ql{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.5px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}

  /* album / artist headers */
  .hero{display:flex;gap:28px;align-items:flex-end;margin-bottom:26px}
  .hero .cover{width:236px;flex:none;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .hero.round .cover{border-radius:50%}
  .hero .info{min-width:0;flex:1}
  .hero .kicker{font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
  .hero h1{font-size:clamp(26px,3.4vw,44px);font-weight:800;letter-spacing:-1px;line-height:1.05;margin:6px 0 8px;overflow-wrap:anywhere}
  .hero .by{font-size:18px;font-weight:700;color:var(--gold);text-decoration:none}
  .hero .by:hover{text-decoration:underline}
  .hero .meta{color:var(--muted);font-size:13px;margin:6px 0 16px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px}
  .chip:hover,.chip.on{border-color:var(--gold);color:var(--gold)}
  .letter{font-size:13px;font-weight:900;color:var(--gold);padding:18px 4px 6px;letter-spacing:1px}
  .alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 14px}
  .arow{display:flex;align-items:center;gap:12px;padding:7px 8px;border-radius:10px;cursor:pointer;min-width:0;text-align:left;width:100%}
  .arow:hover{background:var(--hover)}
  .arow .av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none}
  .arow .av .art,.arow .av .ph{width:46px;height:46px}
  .arow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arow small{color:var(--muted)}
  .arow .grow{min-width:0}
  .genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .gtile{border-radius:14px;padding:18px 16px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-align:left;box-shadow:0 10px 30px -14px rgba(0,0,0,.6);overflow:hidden;position:relative}
  .gtile b{font-size:18px;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.3);overflow-wrap:anywhere}
  .gtile small{opacity:.85;font-weight:700}
  .gtile:hover{filter:brightness(1.1)}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin:-6px 0 6px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .stat b{font-size:18px;display:block}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:800}
  .banner{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:18px}
  .banner .grow{flex:1;min-width:0}
  .bar-prog{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
  .bar-prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}

  /* ---------- player bar ---------- */
  .np-left{display:flex;align-items:center;gap:12px;min-width:0}
  .np-left .cv{width:56px;height:56px;border-radius:8px;overflow:hidden;flex:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .np-left .cv .art,.np-left .cv .ph{width:56px;height:56px}
  .np-text{min-width:0}
  .np-text .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .np-text .a{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np-text .a a{text-decoration:none;cursor:pointer}
  .np-text .a a:hover{color:var(--gold);text-decoration:underline}
  .np-mid{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
  .ctrls{display:flex;align-items:center;gap:6px}
  .playbtn{width:44px;height:44px;border-radius:50%;background:var(--txt);color:var(--bg);display:flex;align-items:center;justify-content:center}
  .playbtn:hover{transform:scale(1.05);background:var(--gold);color:var(--on-gold)}
  .seek{display:flex;align-items:center;gap:10px;width:100%;max-width:640px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .seek span{width:42px;text-align:center;flex:none}
  .np-right{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
  .vol{width:110px}
  input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;--p:0%}
  input[type=range].rng::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--gold) var(--p),var(--line) var(--p))}
  input[type=range].rng::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
  input[type=range].rng::-moz-range-progress{height:4px;border-radius:4px;background:var(--gold)}
  input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--txt);margin-top:-4.5px;opacity:0;transition:opacity .15s}
  input[type=range].rng::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--txt);border:0}
  input[type=range].rng:hover::-webkit-slider-thumb,input[type=range].rng:focus-visible::-webkit-slider-thumb{opacity:1}
  .fmt{font-size:10px;font-weight:900;letter-spacing:.6px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap;margin-right:6px}
  .fmt.hq{color:var(--gold);border-color:var(--gold-dim)}

  /* ---------- up next ---------- */
  #queue{position:fixed;right:0;top:0;bottom:var(--bar);width:min(380px,100%);background:var(--bg2);border-left:1px solid var(--line);z-index:30;transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  #queue.open{transform:none}
  .qhead{display:flex;align-items:center;gap:8px;padding:16px 14px 10px 18px}
  .qhead h3{flex:1;font-size:17px}
  .qbody{overflow-y:auto;flex:1;padding:0 8px 16px}
  .qsec{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px;display:flex;justify-content:space-between;align-items:center}
  .qsec button{color:var(--gold);font-weight:800;text-transform:none;letter-spacing:0;font-size:12px}
  .qrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:9px;cursor:pointer;min-width:0}
  .qrow:hover{background:var(--hover)}
  .qrow.cur{background:var(--panel2)}
  .qrow.cur .t{color:var(--gold)}
  .qrow .cv{width:40px;height:40px;border-radius:6px;overflow:hidden;flex:none}
  .qrow .cv .art,.qrow .cv .ph{width:40px;height:40px}
  .qrow .grow{min-width:0;flex:1}
  .qrow .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qrow .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qrow .x{opacity:0;color:var(--muted);width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center}
  .qrow:hover .x,.qrow .x:focus-visible{opacity:1}
  .qrow .x:hover{color:var(--red)}
  .qrow.drag{opacity:.4}
  .qrow.over{box-shadow:inset 0 2px 0 var(--gold)}

  /* ---------- now playing (full screen) ---------- */
  #np{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow:hidden}
  #np.open{transform:none}
  #np .bgart{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.3);opacity:.45;transform:scale(1.1)}
  html[data-theme="light"] #np .bgart{opacity:.3}
  #np .scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(12,11,14,.2),var(--bg) 92%)}
  html[data-theme="light"] #np .scrim{background:linear-gradient(to bottom,rgba(244,242,248,.25),var(--bg) 92%)}
  #np .inner{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(18px + var(--safe-t)) 24px calc(24px + var(--safe-b));min-height:0}
  #np .top{position:absolute;top:calc(10px + var(--safe-t));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
  #np .top .lbl{font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #np .bigart{width:min(440px,78vw,46vh);aspect-ratio:1;border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -18px rgba(0,0,0,.75);flex:none;transition:transform .25s}
  body.paused #np .bigart{transform:scale(.94)}
  #np .bigart .art,#np .bigart .ph{width:100%;height:100%}
  #np .meta{width:min(520px,100%);text-align:left}
  #np .meta .t{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #np .meta .a{font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #np .meta .a a{cursor:pointer;text-decoration:none}
  #np .meta .a a:hover{color:var(--gold)}
  #np .seek{max-width:520px}
  #np .seek span{width:auto}
  #np .ctrls{gap:18px}

/* ---------- helpers ---------- */
async function api(url,opt){
  opt=opt||{};
  if(opt.body&&typeof opt.body!=='string'){opt.body=JSON.stringify(opt.body);opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});}
  const r=await fetch(url,Object.assign({credentials:'same-origin'},opt));
  if(r.status===401){showLogin();throw new Error('Please sign in');}
  let j=null;try{j=await r.json();}catch(_){}
  if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));
  return j;
}
const withMode=u=>u+(u.includes('?')?'&':'?')+'m='+S.mode;
function fmtT(s){s=Math.max(0,Math.floor(Number(s)||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}
function fmtLong(s){s=Math.round(Number(s)||0);const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?h+' hr'+(m?' '+m+' min':''):(m||(s?1:0))+' min';}
function plural(n,w){return n.toLocaleString()+' '+w+(n===1?'':'s');}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);}
function hue(s){let h=0;s=String(s||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%360;}
function ph(seed,label,round){const h=hue(seed);return '<div class="ph" style="background:linear-gradient(135deg,hsl('+h+' 45% 32%),hsl('+((h+40)%360)+' 55% 18%))'+(round?';border-radius:50%':'')+'">'+(label?'<span style="font:800 26px Manrope,system-ui;opacity:.9">'+esc(label)+'</span>':sv('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',30,'opacity=".8"'))+'</div>';}
function artUrl(key,size){return '/api/music/art/'+key+'?s='+(size||300)+'&v='+(S.lib?S.lib.gen:0);}
function art(key,seed,size,label){return key?'<img class="art" loading="lazy" decoding="async" alt="" src="'+artUrl(key,size)+'" data-seed="'+esc(seed)+'">':ph(seed,label);}
// swap broken images for a placeholder
document.addEventListener('error',e=>{const im=e.target;if(im.tagName==='IMG'&&im.classList.contains('art')){const d=document.createElement('div');d.innerHTML=ph(im.dataset.seed||'');im.replaceWith(d.firstChild);}},true);
function initials(n){return String(n||'?').replace(/^the\s+/i,'').trim().slice(0,1).toUpperCase()||'?';}
function quality(t){
  const lossless=['flac','alac','pcm','pcm_f32','wavpack','ape','tta'].includes(t.c);
  if(lossless&&(t.bt>16||t.sr>48000))return {txt:(t.c==='pcm'?'WAV':t.c.toUpperCase())+' '+(t.bt||24)+'/'+(t.sr/1000).toFixed(t.sr%1000?1:0),hq:true};
  if(lossless)return {txt:t.c==='pcm'?(t.x==='aiff'?'AIFF':'WAV'):t.c.toUpperCase(),hq:true};
  return {txt:(t.c||t.x||'').toUpperCase()+(t.br?' '+Math.round(t.br/1000):''),hq:false};
}

/* ---------- auth & boot ---------- */
function showLogin(){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); setTimeout(()=>$('#lu').focus(),50); }
$('#loginForm').onsubmit=async e=>{
  e.preventDefault(); $('#lerr').textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#lu').value.trim(),password:$('#lp').value})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){$('#lerr').textContent=j.message||'Sign-in failed';return;}
    $('#login').classList.add('hidden'); $('#lp').value=''; boot();
  }catch(err){$('#lerr').textContent=err.message;}
};
async function boot(){
  try{ S.me=await api('/api/me'); }catch(_){ return; }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  buildChrome();
  await loadStatus();
  if(S.status&&S.status.isAdmin&&!$('#navFoot [href="#/matches"]')) $('#navFoot').insertAdjacentHTML('afterbegin','<a class="nav" href="#/matches">'+I.album+'<span>Album matches</span></a>');
  await loadLibrary();
  loadPlaylists();
  restoreQueue();
  route();
}

function markNav(){

/* ---------- data ---------- */
async function loadStatus(){
  try{ S.status=await api('/api/music/status'); S.prefs=S.status.prefs; S.mode=S.prefs.mode; }catch(e){ S.status=S.status||{configured:false}; }
  return S.status;
}
let libEtag='';
async function loadLibrary(force){
  try{
    const r=await fetch(withMode('/api/music/library'),{headers:(!force&&libEtag)?{'If-None-Match':libEtag}:{}});
    if(r.status===401){showLogin();return;}
    if(r.status===304&&S.lib)return S.lib;
    if(!r.ok)throw new Error('HTTP '+r.status);
    libEtag=r.headers.get('ETag')||'';
    S.lib=await r.json();
    S.albums=new Map(S.lib.albums.map(a=>[a.id,a]));
    S.artists=new Map(S.lib.artists.map(a=>[a.id,a]));
    S.genres=new Map(S.lib.genres.map(g=>[g.id,g]));
  }catch(e){ if(!S.lib) S.lib={gen:0,albums:[],artists:[],genres:[],stats:{tracks:0,albums:0,artists:0,duration:0}}; }
  return S.lib;
}
async function loadPlaylists(){
  try{ S.playlists=(await api('/api/music/playlists')).playlists||[]; }catch(_){ S.playlists=[]; }
  paintPlaylistsNav();
}
function paintPlaylistsNav(){
  const smart=[['#/smart/recently-played','Recently Played',I.recent],['#/smart/most-played','Top 100 Most Played',I.star],['#/smart/recently-added','Recently Added Songs',I.song]];
  $('#navPl').innerHTML=smart.map(n=>'<a class="nav" href="'+n[0]+'">'+n[2]+'<span>'+n[1]+'</span></a>').join('')+S.playlists.map(p=>'<a class="nav" href="#/playlist/'+p.id+'" data-drop-pl="'+p.id+'">'+I.pl+'<span>'+esc(p.name)+'</span></a>').join('');
  markNav();
}

/* scan progress: refresh the library when a scan finishes */
let statusTimer=null;
function watchScan(){
  clearTimeout(statusTimer);
  if(!S.status||!S.status.scanning)return;
  statusTimer=setTimeout(async()=>{
    const before=S.status.gen; await loadStatus();
    if(S.route==='settings')renderSettingsStatus();
    paintScanBanner();
    if(!S.status.scanning||S.status.gen!==before){ const g=S.lib&&S.lib.gen; await loadLibrary(true); if(S.lib.gen!==g&&S.route!=='settings')route(true); }
    watchScan();
  },S.route==='settings'?1200:3000);
}
function paintScanBanner(){
  const b=$('#scanBanner'); if(!b)return;
  const st=S.status||{};
  if(!st.scanning){b.remove();return;}
  const p=st.progress||{};
  b.querySelector('.grow').innerHTML='<b>Scanning your music…</b><div class="muted" style="font-size:12.5px">'+esc(p.phase||'Working')+(p.total?' · '+p.done+' of '+p.total:p.found?' · '+p.found+' files found':'')+'</div><div class="bar-prog"><i style="width:'+(p.total?Math.round(p.done/p.total*100):8)+'%"></i></div>';
}
function scanBannerHtml(){ return S.status&&S.status.scanning?'<div class="banner" id="scanBanner"><div class="grow"></div></div>':''; }

/* ---------- router ---------- */
window.addEventListener('hashchange',()=>route());
async function route(keepScroll){
  closeMenu();
  const h=location.hash||'#/home';
  const prevKey=S.routeKey;
  if(prevKey) S.scrolls[prevKey]=$('#main').scrollTop;
  S.routeKey=h;
  const [,name,arg]=h.split('/');
  S.route=name||'home';
  markNav();
  const v=$('#view');
  const st=S.status||{};
  const needLib=!['settings','matches'].includes(S.route);
  if(needLib&&!st.configured){ v.innerHTML=notConfigured(); bindView(); return; }
  if(needLib&&S.lib&&!S.lib.stats.tracks&&S.route!=='search'){
    v.innerHTML=scanBannerHtml()+'<div class="empty">'+I.headphones+'<h2>'+(st.scanning?'Building your library':'No music found yet')+'</h2><p>'+(st.scanning?'MEDIARR is reading your music folders. Albums appear here when the scan finishes.':'MEDIARR didn’t find any audio files in the music folders. '+(st.isAdmin?'Check the folders in Music settings.':'Ask your admin to check the music folders.'))+'</p>'+(st.isAdmin?'<a class="btn primary" href="#/settings">Music settings</a>':'')+'</div>';
    paintScanBanner(); watchScan(); return;
  }
  try{
    switch(S.route){
      case 'home': await viewHome(); break;
      case 'recent': viewAlbums('recent'); break;
      case 'albums': viewAlbums(); break;
      case 'album': await viewAlbum(arg); break;
      case 'artists': viewArtists(); break;
      case 'artist': await viewArtist(arg); break;
      case 'songs': await viewSongs(); break;
      case 'genres': viewGenres(); break;
      case 'genre': await viewGenre(arg); break;
      case 'playlists': viewPlaylists(); break;
      case 'playlist': await viewPlaylist(arg); break;
      case 'smart': await viewSmart(arg); break;
      case 'search': await viewSearch(decodeURIComponent(arg||'')); break;
      case 'settings': await viewSettings(); break;
      case 'matches': await viewMatches(arg); break;
      default: location.hash='#/home'; return;
    }
  }catch(e){ v.innerHTML='<div class="empty"><h2>Something went wrong</h2><p>'+esc(e.message)+'</p><a class="btn" href="#/home">Go home</a></div>'; }
  paintScanBanner(); watchScan();
  bindView(); highlightPlaying();
  $('#main').scrollTop=(keepScroll===true||S.scrolls[h]!=null)&&S.routeKey===h?(S.scrolls[h]||0):0;
}
function notConfigured(){
  const admin=S.status&&S.status.isAdmin;
  return '<div class="empty">'+I.headphones+'<h2>Set up your music library</h2><p>'+(admin?'Add the folders where your music lives. MEDIARR scans every sub-folder for MP3, FLAC, OGG, Opus, M4A, ALAC, WAV, AIFF, WMA and more, and keeps albums together.':'Your admin hasn’t added any music folders yet. Once they do, your music will appear here.')+'</p>'+(admin?'<a class="btn primary" href="#/settings">Add music folders</a>':'<a class="btn" href="/">Back to MEDIARR</a>')+'</div>';
}

/* ---------- shared renderers ---------- */
function albumCard(a,opts){

}
function artistCard(a){
  return '<div class="card round" data-artist="'+a.id+'" tabindex="0" role="link"><div class="cover">'+(a.art?art(a.art,a.name,300):ph(a.name,initials(a.name)))+'</div><div class="t">'+esc(a.name)+'</div><div class="a">'+plural(a.albums,'album')+'</div></div>';
}
// columns: num | mini | title | album | time | plays | more
function trackTable(list,opts){
  opts=opts||{};
  const showAlbum=opts.album!==false, mini=!!opts.mini, discs=!!opts.discs;
  const cols=4+(mini?1:0)+(showAlbum?1:0)+(opts.genre?1:0)+(opts.plays?1:0);
  let h='<table class="tracks" data-list="'+(opts.listId||'')+'"><colgroup><col style="width:'+(NARROW.matches?34:52)+'px">'+(mini?'<col style="width:46px">':'')+'<col>'+(showAlbum?'<col class="c-album" style="width:30%">':'')+(opts.genre?'<col class="c-genre" style="width:13%">':'')+(opts.plays?'<col class="c-plays" style="width:70px">':'')+'<col style="width:64px"><col style="width:44px"></colgroup>';
  if(opts.head!==false){
    const th=(k,l,cls)=>'<th class="'+(cls||'')+(opts.sortable?' sortable':'')+(opts.sort===k?' sorted':'')+'" '+(opts.sortable?'data-sort="'+k+'"':'')+'>'+l+(opts.sort===k?(opts.dir==='desc'?' ↓':' ↑'):'')+'</th>';
    h+='<thead><tr><th class="num">#</th>'+(mini?'<th class="mini"></th>':'')+th('title','Title')+(showAlbum?th('album','Album','c-album'):'')+(opts.genre?th('genre','Genre','c-genre'):'')+(opts.plays?th('plays','Plays','c-plays'):'')+th('duration','Time','time')+'<th class="more"></th></tr></thead>';
  }
  h+='<tbody>';
  let lastDisc=null;
  list.forEach((t,i)=>{
    if(discs&&opts.discCount>1&&(t.dn||1)!==lastDisc){ lastDisc=t.dn||1; h+='<tr><td colspan="'+cols+'" class="disc">Disc '+lastDisc+'</td></tr>'; }
    const showArtist=opts.artist!==false&&(!opts.albumArtist||norm(t.a)!==norm(opts.albumArtist));
    const n=opts.numbers==='track'?(t.n||'–'):(opts.offset||0)+i+1;
    h+='<tr class="tr" data-i="'+i+'" data-tid="'+t.id+'"'+(opts.draggable?' draggable="true"':'')+'><td class="num"><span class="n">'+n+'</span><span class="eq"><i></i><i></i><i></i></span><button class="pbtn" data-row-play aria-label="Play">'+I.play+'</button></td>'
      +(mini?'<td class="mini">'+(t.art?'<img class="art" loading="lazy" decoding="async" alt="" src="'+artUrl(t.art,96)+'" data-seed="'+esc(t.al)+'">':ph(t.al))+'</td>':'')
      +'<td class="ttl" title="'+esc(t.t)+'">'+esc(t.t)+(showArtist?'<small>'+esc(t.a)+'</small>':'')+'</td>'
      +(showAlbum?'<td class="c-album muted">'+esc(t.al)+'</td>':'')

  });
  return h+'</tbody></table>';
}

function bindView(){

  v.querySelectorAll('[data-play-album]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); playAlbum(b.dataset.playAlbum); });
  v.querySelectorAll('[data-artist]').forEach(el=>{ el.onclick=()=>{ location.hash='#/artist/'+el.dataset.artist; }; el.onkeydown=e=>{ if(e.key==='Enter')el.click(); }; });

function bindTable(tb){
  const L=LISTS.get(tb.dataset.list); if(!L)return;
  const play=i=>playFromList(L,i);
  tb.querySelectorAll('tr.tr').forEach(tr=>{
    const i=Number(tr.dataset.i);
    tr.ondblclick=e=>{ if(e.target.closest('button'))return; play(i); };
    tr.onclick=e=>{
      if(e.target.closest('[data-row-more]')){ e.stopPropagation(); trackMenu(L.tracks[i],e,L,i); return; }
      if(e.target.closest('[data-row-play]')||NARROW.matches||matchMedia('(hover:none)').matches){ play(i); return; }
      tb.querySelectorAll('tr.sel').forEach(x=>x.classList.remove('sel')); tr.classList.add('sel');
    };
    tr.oncontextmenu=e=>{ e.preventDefault(); trackMenu(L.tracks[i],e,L,i); };
    tr.onkeydown=e=>{ if(e.key==='Enter')play(i); };
  });
  tb.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{ if(L.ctx&&L.ctx.onSort)L.ctx.onSort(th.dataset.sort); });
  if(L.ctx&&L.ctx.draggable) bindDrag(tb,L);
}

function albumSorter(k){
  const c=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'}).compare, sk=s=>norm(s).replace(/^(the|a|an) /,'');
  return {title:(a,b)=>c(sk(a.t),sk(b.t)),artist:(a,b)=>c(sk(a.a),sk(b.a))||(a.y||0)-(b.y||0)||c(sk(a.t),sk(b.t)),year:(a,b)=>(b.y||0)-(a.y||0)||c(sk(a.a),sk(b.a)),recent:(a,b)=>(b.ad||0)-(a.ad||0)}[k]||((a,b)=>c(sk(a.t),sk(b.t)));
}
function chunkedGrid(container,items,render){
  container.innerHTML=''; let i=0; const step=72;
  const sentinel=document.createElement('div'); sentinel.style.height='1px';
  const add=()=>{ const frag=document.createElement('div'); frag.innerHTML=items.slice(i,i+step).map(render).join(''); i+=step; while(frag.firstChild)container.appendChild(frag.firstChild); bindView(); if(i>=items.length){ io.disconnect(); sentinel.remove(); } };
  const io=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting))add(); },{root:$('#main'),rootMargin:'800px'});
  container.after(sentinel); add(); if(i<items.length)io.observe(sentinel);
}

  else if(on.enabled&&m.lastError&&m.lastErrorKind==='busy') h+='<div class="muted" style="margin-top:8px;font-size:12.5px">MusicBrainz is busy right now. MEDIARR is waiting and will retry those albums automatically; nothing to do.</div>';

  box.innerHTML=h;
  if(on.enabled&&(m.running||m.queued)&&S.route==='settings') metaTimer=setTimeout(async()=>{ if(S.route!=='settings')return; await loadStatus(); paintMeta(); },2000);
  else if(S.route==='settings'&&m.done) loadLibrary(true);
}

function dlg(title,bodyHtml,buttons){
  return new Promise(res=>{
    const d=document.createElement('div'); d.id='dlg';
    d.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="dh"><h3>'+esc(title)+'</h3><button class="iconbtn" data-x aria-label="Close">'+I.x+'</button></div><div class="db">'+bodyHtml+'</div><div class="df">'+buttons.map((b,i)=>'<button class="btn'+(b.primary?' primary':'')+(b.danger?' danger':'')+'" data-b="'+i+'">'+esc(b.label)+'</button>').join('')+'</div></div>';
    document.body.appendChild(d);
    const done=v=>{ d.remove(); document.removeEventListener('keydown',key,true); res(v); };
    const key=e=>{ if(e.key==='Escape'){ e.stopPropagation(); done(null); } if(e.key==='Enter'&&e.target.tagName==='INPUT'){ e.preventDefault(); const pb=buttons.findIndex(b=>b.primary); if(pb>=0)done(buttons[pb].value(d)); } };
    document.addEventListener('keydown',key,true);
    d.onclick=e=>{ if(e.target===d)done(null); };
    d.querySelector('[data-x]').onclick=()=>done(null);
    d.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>done(buttons[Number(b.dataset.b)].value(d)));
    const inp=d.querySelector('input'); setTimeout(()=>{ if(inp){inp.focus();inp.select();} else d.querySelector('.btn.primary,.btn').focus(); },30);
  });
}

function openMenu(e,items,header){
  closeMenu();

  const scrim=document.createElement('div'); scrim.id='scrim'; scrim.onclick=closeMenu; scrim.oncontextmenu=ev=>{ev.preventDefault();closeMenu();};
  document.body.appendChild(scrim); document.body.appendChild(m);
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ closeMenu(); items[Number(b.dataset.i)].fn(); });
  const r=m.getBoundingClientRect();
  let x=e&&e.clientX!=null&&(e.clientX||e.clientY)?e.clientX:(e&&e.currentTarget?e.currentTarget.getBoundingClientRect().left:innerWidth/2);
  let y=e&&e.clientY!=null&&(e.clientX||e.clientY)?e.clientY:(e&&e.currentTarget?e.currentTarget.getBoundingClientRect().bottom:innerHeight/2);
  if(NARROW.matches){ m.style.left='8px'; m.style.right='8px'; m.style.maxWidth='none'; m.style.bottom='calc(8px + env(safe-area-inset-bottom))'; m.style.borderRadius='16px'; }
  else{ x=Math.min(x,innerWidth-r.width-8); y=Math.min(y,innerHeight-r.height-8); m.style.left=Math.max(8,x)+'px'; m.style.top=Math.max(8,y)+'px'; }
  const first=m.querySelector('button'); if(first)first.focus({preventScroll:true});

/* ---------- direct links (2.10) ---------- */
const LINK_CHOICES=[[1,'1 hour'],[24,'1 day'],[168,'7 days'],[720,'30 days'],[2160,'90 days'],[8760,'1 year'],[0,'Never']];
const linksOn=()=>!!(S.status&&S.status.links&&S.status.links.enabled);
function linkChoices(policy){ return LINK_CHOICES.filter(([h])=>h===0?!policy.maxDays:(!policy.maxDays||h<=policy.maxDays*24)); }
function relTime(ts){
  const d=ts-Date.now(), a=Math.abs(d), m=Math.round(a/60000), h=Math.round(a/3600000), dd=Math.round(a/86400000);
  const s=m<1?'less than a minute':m<60?plural(m,'minute'):h<48?plural(h,'hour'):dd<60?plural(dd,'day'):dd<730?plural(Math.round(dd/30),'month'):plural(Math.round(dd/365),'year');
  return d>=0?'in '+s:s+' ago';
}
function expText(k){ return !k.expires?'Never expires':k.expired?'Expired '+relTime(k.expires):'Expires '+relTime(k.expires); }
function directUrl(key,kind,id,t,fmt){
  const base=location.origin+'/music/d/'+key+'/';
  if(kind==='t'){ const ext=fmt==='mp3'?'mp3':(t&&t.x||'audio'); const name=((t?[t.a,t.t].filter(Boolean).join(' - '):'')||'track').replace(/[\\/:*?"<>|#%]+/g,' ').trim().slice(0,120)+'.'+ext; return base+'t/'+id+'/'+encodeURIComponent(name)+(fmt==='mp3'?'?format=mp3':''); }
  const q=[]; if(kind==='album')q.push('m='+S.mode); if(fmt==='mp3')q.push('format=mp3');
  return base+kind+'/'+id+'.m3u8'+(q.length?'?'+q.join('&'):'');
}
async function copyText(text,input){

  catch(_){ if(input){ input.focus(); input.select(); try{ return document.execCommand('copy'); }catch(__){} } return false; }
}

/* Fix match: search MusicBrainz and Deezer, pick the right album or artist (like Plex) */
async function fixMatch(kind,id,inf){
  if(kind==='album'&&!inf){ try{ inf=(await api(withMode('/api/music/album/'+id))).info; }catch(_){} }
  if(kind==='artist'&&!inf){ try{ inf=(await api(withMode('/api/music/artist/'+id))).info; }catch(_){} }
  const a=kind==='album'?S.albums.get(id):S.artists.get(id);
  const title=kind==='album'&&a?a.t:'', artist=kind==='album'?(a?a.a:''):(a?a.name:'');
  const cur=!inf||inf.status==='pending'?'Not looked up yet.':inf.status==='ok'?'Matched to <b>'+esc(inf.matchTitle||'?')+'</b>'+(inf.matchArtist?' by '+esc(inf.matchArtist):'')+' on '+(inf.source==='deezer'?'Deezer':'MusicBrainz')+(inf.manual?' (picked by hand)':inf.score?' ('+inf.score+'% match)':'')+'.':inf.status==='skip'?'Unmatched: online info isn’t used.':inf.status==='error'?'Couldn’t check yet: the music services didn’t answer.':'No match found automatically.';
  const d=document.createElement('div'); d.id='dlg';
  d.innerHTML='<div class="box fm" role="dialog" aria-modal="true" aria-label="Fix match"><div class="dh"><h3>Fix match: '+esc(kind==='album'?title:artist)+'</h3><button class="iconbtn" data-x aria-label="Close">'+I.x+'</button></div>'
    +'<div class="db"><p class="muted" style="font-size:13px;margin:0 0 12px">'+cur+' Search, then pick the right '+(kind==='album'?'album':'artist')+'.</p>'
    +'<form class="fmq" autocomplete="off">'+(kind==='album'?'<input class="inp" name="t" placeholder="Album" aria-label="Album" value="'+esc(title)+'">':'')+'<input class="inp" name="a" placeholder="Artist" aria-label="Artist" value="'+esc(artist)+'"><button class="btn primary" type="submit">'+I.search+'Search</button></form>'
    +(kind==='album'&&inf&&inf.ownArt?'<label class="fmart"><input type="checkbox" id="fmUseArt"'+(inf.useArt?' checked':'')+'> Use the matched album’s cover instead of this album’s own picture</label>':'')
    +'<div class="fmres" id="fmRes" aria-live="polite"></div></div></div>';
  document.body.appendChild(d);
  const close=()=>{ d.remove(); document.removeEventListener('keydown',key,true); };

  d.querySelector('[data-x]').onclick=close;

      if(!d.isConnected)return;
      const isCur=x=>inf&&inf.status==='ok'&&((x.source==='musicbrainz'&&x.id===inf.mbid)||(x.source==='deezer'&&x.id===inf.deezerId&&(kind==='artist'||inf.source==='deezer')));
      out.innerHTML=(r.problems&&r.problems.length?'<div class="fmsg" style="margin:0 0 8px">'+r.problems.map(esc).join('<br>')+'</div>':'')
        +(r.results.length?r.results.map((x,i)=>'<button class="fmrow'+(isCur(x)?' cur':'')+'" data-i="'+i+'"><span class="th'+(kind==='artist'?' round':'')+'">'+(x.thumb?'<img class="art" loading="lazy" alt="" src="'+esc(x.thumb)+'" data-seed="'+esc(x.title)+'">':ph(x.title))+'</span>'
          +'<span class="grow"><b>'+esc(x.title)+'</b><small>'+esc([x.artist,x.year||'',x.type&&x.type!=='Album'?x.type:'',x.secondary,x.tracks?plural(x.tracks,'track'):'',kind==='artist'&&x.albums?plural(x.albums,'album'):'',kind==='artist'&&x.fans?Number(x.fans).toLocaleString()+' fans':''].filter(Boolean).join(' · '))+'</small></span>'

/* ================= player ================= */
function mimeFor(t){
  switch(t.c){
    case 'mp3': case 'mp2': return 'audio/mpeg';
    case 'aac': return (t.x==='aac'||t.x==='adts')?'audio/aac':'audio/mp4; codecs="mp4a.40.2"';
    case 'alac': return 'audio/mp4; codecs="alac"';
    case 'flac': return t.x==='flac'?'audio/flac':(t.x==='ogg'||t.x==='oga')?'audio/ogg; codecs="flac"':'audio/mp4; codecs="flac"';
    case 'vorbis': return 'audio/ogg; codecs="vorbis"';
    case 'opus': return (t.x==='weba'||t.x==='webm')?'audio/webm; codecs="opus"':'audio/ogg; codecs="opus"';
    case 'pcm': return (t.x==='wav'||t.x==='wave')?'audio/wav; codecs="1"':'audio/aiff';
    case 'pcm_f32': return (t.x==='wav'||t.x==='wave')?'audio/wav; codecs="3"':'audio/aiff';
    default: return '';
  }
}
function canDirect(t){ const m=mimeFor(t); if(!m)return false; return au.canPlayType(m)!==''; }
const cur=()=>P.queue[P.idx]||null;
const curTime=()=>P.offset+(au.currentTime||0);
const curDur=()=>{ const t=cur(); if(!t)return 0; if(!P.tc&&isFinite(au.duration)&&au.duration>0)return au.duration; return t.d||0; };

function playTracks(list,start,opts){
  opts=opts||{};
  if(!list||!list.length)return;
  list=list.filter(Boolean);
  P.orig=null; P.from=opts.from||''; P.fromHash=location.hash;
  if(opts.shuffle){
    P.queue=opts.shuffle==='album'?shuffleAlbums(list):shuffleArr(list);
    P.shuffle=true; P.orig=list.slice(); start=0;
  } else { P.queue=list.slice(); if(P.shuffle){ P.orig=list.slice(); const first=P.queue.splice(start,1)[0]; P.queue=[first].concat(S.prefs&&S.prefs.albumShuffle?shuffleAlbums(P.queue):shuffleArr(P.queue)); start=0; } }
  loadTrack(start,true);
  paintModes();
}
function shuffleArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shuffleAlbums(list){ const g=new Map(); for(const t of list){ if(!g.has(t.ali))g.set(t.ali,[]); g.get(t.ali).push(t); } return shuffleArr([...g.values()]).flat(); }
async function playFromList(L,i){
  const t=L.tracks[i]; if(!t)return;
  const isAlbumList=L.ctx&&L.ctx.albumId;
  const isPlaylist=L.ctx&&(L.ctx.playlistId||['Recently Played','Top 100 Most Played','Recently Added Songs','Most played'].includes(L.ctx.name));
  if(!isAlbumList&&!isPlaylist&&S.prefs&&S.prefs.continueAlbum){
    try{ const at=await albumTracks(t.ali); const k=at.findIndex(x=>x.id===t.id); if(k>=0){ playTracks(at,k,{from:t.al}); return; } }catch(_){}
  }
  playTracks(L.tracks,i,{from:L.ctx&&L.ctx.name});
}
async function playAlbum(id){ try{ const tr=await albumTracks(id); playTracks(tr,0,{from:(S.albums.get(id)||{}).t}); }catch(e){ toast(e.message); } }
async function shuffleAll(by){
  by=by||(S.prefs&&S.prefs.albumShuffle?'album':'song');
  try{ const d=await api(withMode('/api/music/shuffle?by='+by+'&limit=400')); if(!d.tracks.length)return toast('No music to shuffle'); P.shuffle=true; P.queue=d.tracks; P.orig=null; P.from='Shuffle all'; P.fromHash='#/home'; loadTrack(0,true); paintModes(); toast(by==='album'?'Shuffling albums':'Shuffling all songs'); }catch(e){ toast(e.message); }
}
async function shuffleScope(scope,name){
  const by=S.prefs&&S.prefs.albumShuffle?'album':'song';
  try{ const d=await api(withMode('/api/music/shuffle?by='+by+'&scope='+encodeURIComponent(scope)+'&limit=400')); if(!d.tracks.length)return; P.shuffle=true; P.queue=d.tracks; P.orig=null; P.from=name; P.fromHash=location.hash; loadTrack(0,true); paintModes(); }catch(e){ toast(e.message); }
}
function playNext(list){
  if(!cur()){ playTracks(list,0); return; }
  P.queue.splice(P.idx+1,0,...list); if(P.orig)P.orig.push(...list);
  toast(list.length===1?'Playing “'+list[0].t+'” next':plural(list.length,'song')+' playing next'); saveQueue(); paintQueue();
}
function addToQueue(list){
  if(!cur()){ playTracks(list,0); return; }
  P.queue.push(...list); if(P.orig)P.orig.push(...list);
  toast(list.length===1?'Added “'+list[0].t+'” to Up Next':'Added '+plural(list.length,'song')+' to Up Next'); saveQueue(); paintQueue();
}
function srcFor(t,tc,from){ return '/api/music/stream/'+t.id+(tc?'?tc=1'+(from>0?'&t='+from.toFixed(2):''):''); }
function loadTrack(i,autoplay,startAt){
  if(i<0||i>=P.queue.length)return;
  P.idx=i; const t=cur();
  P.tc=!canDirect(t)&&!!(S.status&&S.status.transcode);
  P.triedTc=P.tc; P.logged=false; P.listened=0; P.lastT=0;
  P.offset=P.tc?(startAt||0):0;
  au.src=srcFor(t,P.tc,P.offset);
  if(!P.tc&&startAt){ const seekOnce=()=>{ try{au.currentTime=startAt;}catch(_){} au.removeEventListener('loadedmetadata',seekOnce); }; au.addEventListener('loadedmetadata',seekOnce); }
  if(autoplay){ const pr=au.play(); if(pr&&pr.catch)pr.catch(err=>{ if(err&&err.name==='NotAllowedError'){ document.body.classList.add('paused'); paintPlayState(); } }); }
  paintNow(); saveQueue(); paintQueue(); highlightPlaying();
}
function next(auto){
  if(!P.queue.length)return;
  if(auto&&P.repeat==='one'){ seekTo(0); au.play().catch(()=>{}); return; }
  if(P.idx<P.queue.length-1){ loadTrack(P.idx+1,true); return; }
  if(P.repeat==='all'){ if(P.shuffle)P.queue=S.prefs&&S.prefs.albumShuffle?shuffleAlbums(P.queue):shuffleArr(P.queue); loadTrack(0,true); return; }
  if(auto){ au.pause(); seekTo(0); paintPlayState(); }
}
function prev(){
  if(curTime()>3||P.idx===0){ seekTo(0); return; }
  loadTrack(P.idx-1,true);
}
function toggle(){
  if(!cur()){ shuffleAll(); return; }
  if(au.paused){ if(!au.src){ loadTrack(P.idx,true,P.resumeAt||0); return; } au.play().catch(()=>{}); } else au.pause();
}
function seekTo(sec){
  const t=cur(); if(!t)return;
  sec=Math.max(0,Math.min(sec,(curDur()||t.d||0)-0.25));
  if(P.tc){ const playing=!au.paused; P.offset=sec; au.src=srcFor(t,true,sec); if(playing)au.play().catch(()=>{}); paintTime(); }
  else { try{ au.currentTime=sec; }catch(_){} }
  updatePosition();
}
function setShuffle(on){
  P.shuffle=on;
  const c=cur();
  if(on){ P.orig=P.queue.slice(); const rest=P.queue.filter((_,i)=>i!==P.idx); const sh=S.prefs&&S.prefs.albumShuffle?shuffleAlbums(rest):shuffleArr(rest); P.queue=c?[c].concat(sh):sh; P.idx=c?0:-1; }
  else if(P.orig){ const k=c?P.orig.findIndex(x=>x.id===c.id):-1; P.queue=P.orig; P.orig=null; P.idx=k>=0?k:0; }
  paintModes(); paintQueue(); saveQueue(); toast(on?(S.prefs&&S.prefs.albumShuffle?'Shuffle on · whole albums':'Shuffle on'):'Shuffle off');
}
function cycleRepeat(){ P.repeat=P.repeat==='off'?'all':P.repeat==='all'?'one':'off'; paintModes(); saveQueue(); toast(P.repeat==='off'?'Repeat off':P.repeat==='all'?'Repeat all':'Repeat this song'); }

/* audio events */
au.addEventListener('play',()=>{ document.body.classList.remove('paused'); paintPlayState(); });
au.addEventListener('pause',()=>{ document.body.classList.add('paused'); paintPlayState(); saveQueue(); });
au.addEventListener('ended',()=>next(true));
au.addEventListener('timeupdate',()=>{
  paintTime();

  if(dt>0&&dt<2)P.listened+=dt;
  const t=cur();
  if(t&&!P.logged&&(P.listened>=30||(t.d&&P.listened>=t.d*0.5))){ P.logged=true; api('/api/music/played',{method:'POST',body:{id:t.id}}).then(()=>{ t.pc=(t.pc||0)+1; }).catch(()=>{}); }
  if(Date.now()-(P.saved||0)>10000)saveQueue();
});

au.addEventListener('error',async()=>{

  $$('[data-act="toggle"]').forEach(b=>{ b.innerHTML=playing?I.pause:I.play; b.setAttribute('aria-label',playing?'Pause':'Play'); b.title=playing?'Pause (Space)':'Play (Space)'; });

  document.title=(cur()&&playing?'▶ '+cur().t+' · ':'')+'Music · MEDIARR';
}
function paintModes(){
  $$('[data-act="shuffle"]').forEach(b=>{ b.classList.toggle('on',P.shuffle); b.setAttribute('aria-pressed',P.shuffle); });
  $$('[data-act="repeat"]').forEach(b=>{ b.classList.toggle('on',P.repeat!=='off'); b.innerHTML=P.repeat==='one'?I.repeat1:I.repeat; b.setAttribute('aria-label','Repeat: '+P.repeat); });
}
function paintTime(){

  $$('[data-cur]').forEach(e=>e.textContent=fmtT(c));

  $$('[data-fmt]').forEach(e=>{ if(!t){e.classList.add('hidden');return;} const q=quality(t); e.classList.remove('hidden'); e.classList.toggle('hq',q.hq&&!P.tc); e.textContent=P.tc?q.txt.split(' ')[0]+' → '+(S.status.transcode||'mp3').toUpperCase():q.txt; e.title=P.tc?'Converted on the server so this browser can play it':'Playing the original file'; });

function updatePosition(){

function paintQueue(){
  const q=$('#queue'); if(!q.classList.contains('open'))return;

  let from=-1;

    r.ondragend=()=>{ r.classList.remove('drag'); $$('#qBody .over').forEach(x=>x.classList.remove('over')); };
    r.ondragover=e=>{ e.preventDefault(); $$('#qBody .over').forEach(x=>x.classList.remove('over')); r.classList.add('over'); };
    r.ondrop=e=>{ e.preventDefault(); const to=Number(r.dataset.qi); if(from<=P.idx||to<=P.idx||from===to)return; const [x]=P.queue.splice(from,1); P.queue.splice(to,0,x); paintQueue(); saveQueue(); };
  });
}
$('#qSave').onclick=()=>{ const ids=P.queue.map(t=>t.id); if(!ids.length)return toast('Up Next is empty'); newPlaylist(ids); };

/* queue persistence (per device) */
function saveQueue(){
  P.saved=Date.now();
  LS.set('mm-state',{q:P.queue.slice(0,1000).map(t=>t.id),i:P.idx,pos:cur()?curTime():0,sh:P.shuffle,rp:P.repeat,from:P.from,u:S.me&&S.me.username});
}
async function restoreQueue(){
  const st=LS.get('mm-state',null);
  if(!st||!Array.isArray(st.q)||!st.q.length||(S.me&&st.u&&st.u!==S.me.username))return;
  try{
    const d=await api(withMode('/api/music/tracks'),{method:'POST',body:{ids:st.q}});
    if(!d.tracks.length)return;
    const want=st.q[st.i];
    P.queue=d.tracks; P.idx=Math.max(0,d.tracks.findIndex(t=>t.id===want)); P.shuffle=!!st.sh; P.repeat=st.rp||'off'; P.from=st.from||'';
    P.resumeAt=d.tracks[P.idx]&&d.tracks[P.idx].id===want?(st.pos||0):0;
    paintNow(); paintModes();
    const t=cur(); if(t){ const d2=t.d||0; $$('[data-cur]').forEach(e=>e.textContent=fmtT(P.resumeAt)); const pct=d2?P.resumeAt/d2*100:0; $$('[data-seek]').forEach(r=>{ r.value=Math.round(pct*10); r.style.setProperty('--p',pct+'%'); }); }
  }catch(_){}
}

/* keyboard */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable||$('#dlg')||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'){ if($('#menu'))return closeMenu(); if($('#np').classList.contains('open'))return closeNp(); if($('#queue').classList.contains('open'))return toggleQueue(false); return; }
  if(e.key===' '&&!e.target.closest('button,a')){ e.preventDefault(); toggle(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); e.shiftKey?next():seekTo(curTime()+10); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); e.shiftKey?prev():seekTo(curTime()-10); }
  else if(e.key==='ArrowUp'&&!e.target.closest('#menu')){ e.preventDefault(); setVol(au.volume+0.05); }
  else if(e.key==='ArrowDown'&&!e.target.closest('#menu')){ e.preventDefault(); setVol(au.volume-0.05); }
  else if(e.key==='/'){ e.preventDefault(); (NARROW.matches?$('#qm'):$('#q')).focus(); }
  else if(e.key==='s'||e.key==='S')setShuffle(!P.shuffle);
  else if(e.key==='r'||e.key==='R')cycleRepeat();
  else if(e.key==='m'||e.key==='M')setMute(!au.muted);
  else if(e.key==='q'||e.key==='Q')toggleQueue();
});
NARROW.addEventListener('change',()=>{ paintNow(); route(true); });
window.addEventListener('pagehide',saveQueue);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden')saveQueue(); });

boot();
})();
</script>
