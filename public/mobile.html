<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0f">
<title>MEDIARR</title>
<script>try{document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('mediarr-theme')||'dark');}catch(e){}</script>
<!-- Bootstrap 5 — bundled locally for offline use. Drop these two files into /public:
       bootstrap.min.css  and  bootstrap.bundle.min.js
     (from https://github.com/twbs/bootstrap/releases  →  dist/ , or
      https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/) -->
<link href="/bootstrap.min.css" rel="stylesheet">
<style>
  :root{ --gold:#d4af6d; --bg:#0c0c0f; --bg2:#141418; }
  [data-bs-theme=dark]{
    --bs-body-bg:var(--bg); --bs-body-color:#e9e9ee;
    --bs-primary:var(--gold); --bs-primary-rgb:212,175,109;
    --bs-border-color:#26262e; --bs-secondary-color:#9a9aa6;
    --bs-emphasis-color:#fff;
  }
  [data-bs-theme=light]{
    --gold:#a9762a; --bg:#f4f2f8; --bg2:#ffffff;
    --bs-body-bg:var(--bg); --bs-body-color:#211c2a;
    --bs-primary:var(--gold); --bs-primary-rgb:169,118,42;
    --bs-border-color:#e0d9ea; --bs-secondary-color:#6c6480;
    --bs-emphasis-color:#000;
  }
  [data-bs-theme=light] .poster{ background:#e7e2ee; }
  [data-bs-theme=light] .btn-outline-gold{ --bs-btn-border-color:#d8c49a; }
  body{ background:var(--bg); -webkit-tap-highlight-color:transparent; padding-bottom:env(safe-area-inset-bottom); }
  .brand{ font-weight:800; letter-spacing:.5px; }
  .brand b{ color:var(--gold); }
  .btn-gold{ --bs-btn-bg:var(--gold); --bs-btn-border-color:var(--gold); --bs-btn-color:#1a1408;
    --bs-btn-hover-bg:#e0bd7e; --bs-btn-hover-border-color:#e0bd7e; --bs-btn-hover-color:#1a1408; font-weight:700; }
  .btn-outline-gold{ --bs-btn-color:var(--gold); --bs-btn-border-color:#3a3326; --bs-btn-hover-bg:var(--gold); --bs-btn-hover-border-color:var(--gold); --bs-btn-hover-color:#1a1408; }
  .navbar{ background:var(--bg2); border-bottom:1px solid var(--bs-border-color); }
  .searchwrap{ position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0; }
  .poster{ width:100%; aspect-ratio:2/3; object-fit:cover; background:#1c1c22; display:block; }
  .poster.ph{ display:flex; align-items:center; justify-content:center; color:var(--bs-secondary-color); font-size:.8rem; }
  .mcard{ background:var(--bg2); border:1px solid var(--bs-border-color); border-radius:.7rem; overflow:hidden; height:100%; display:flex; flex-direction:column; position:relative; }
  .mcard .body{ padding:.5rem .6rem .6rem; display:flex; flex-direction:column; gap:.35rem; flex:1; }
  .mcard .t{ font-size:.85rem; font-weight:700; line-height:1.15; }
  .mcard .y{ font-size:.72rem; color:var(--bs-secondary-color); }
  .mcard .tag{ position:absolute; top:.4rem; left:.4rem; font-size:.62rem; }
  .mcard .fav-btn{ position:absolute; top:.35rem; right:.35rem; z-index:3; background:rgba(0,0,0,.55); border:none; border-radius:50%; width:27px; height:27px; color:#fff; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0; }
  .mcard .fav-btn.on{ color:#ff4d6d; }
  .mcard .wl-btn{ position:absolute; top:.35rem; left:.35rem; z-index:3; background:rgba(0,0,0,.55); border:none; border-radius:50%; width:27px; height:27px; color:#e5a00d; font-size:14px; display:flex; align-items:center; justify-content:center; padding:0; }
  .mcard .seen-dot{ position:absolute; top:.35rem; right:2.35rem; z-index:3; background:rgba(0,0,0,.55); border-radius:50%; width:27px; height:27px; color:#4ade80; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .mcard .chk{ position:absolute; top:.4rem; right:.4rem; background:#1c3a24; color:#7ee29a; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-size:.8rem; }
  .add-sm{ font-size:.72rem; padding:.3rem .4rem; margin-top:auto; }
  .modal-content,.offcanvas{ background:var(--bg2); }
  .detail-poster{ width:96px; aspect-ratio:2/3; object-fit:cover; border-radius:.5rem; flex:none; }
  .sec-h{ font-weight:800; font-size:.95rem; margin:18px 0 8px; }
  .hscroll{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
  .hscroll::-webkit-scrollbar{ height:5px; } .hscroll::-webkit-scrollbar-thumb{ background:#333; border-radius:3px; }
  .castc{ flex:none; width:80px; text-align:center; cursor:pointer; }
  .castc .ph2{ width:80px; height:120px; object-fit:cover; border-radius:8px; background:#1c1c22; display:flex; align-items:center; justify-content:center; color:#777; font-weight:800; font-size:22px; }
  .castc .nm{ font-size:.7rem; font-weight:700; margin-top:5px; line-height:1.15; }
  .castc .rl{ font-size:.66rem; line-height:1.15; }
  .crewrow{ display:flex; flex-wrap:wrap; gap:8px; }
  .crewc{ display:flex; align-items:center; gap:9px; background:var(--bg); border:1px solid var(--bs-border-color); border-radius:22px; padding:5px 14px 5px 5px; cursor:pointer; }
  .crewc .ph3{ width:36px; height:36px; border-radius:50%; object-fit:cover; background:#1c1c22; flex:none; display:flex; align-items:center; justify-content:center; color:#777; font-weight:800; }
  .recc{ flex:none; width:98px; cursor:pointer; }
  .recc .ph4{ width:98px; height:147px; object-fit:cover; border-radius:8px; background:#1c1c22; display:block; }
  .recc .nm{ font-size:.7rem; font-weight:600; margin-top:5px; line-height:1.15; }
  .seg .btn{ font-size:.8rem; }
  .state{ text-align:center; color:var(--bs-secondary-color); padding:42px 16px; }
  a{ color:var(--gold); }
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div id="authView" class="d-none">
  <div class="container" style="max-width:420px">
    <div class="text-center mt-5 mb-4"><div class="brand fs-1">MEDI<b>ARR</b></div><div class="text-secondary small">Cinemeta · Radarr · Sonarr</div></div>
    <div class="card border-0" style="background:var(--bg2)">
      <div class="card-body p-4">
        <h5 id="authTitle" class="mb-3">Sign in</h5>
        <div id="authErr" class="alert alert-danger py-2 small d-none" role="alert"></div>
        <div class="mb-3"><label class="form-label small">Username</label><input id="authUser" class="form-control" autocomplete="username" autocapitalize="none"></div>
        <div class="mb-3"><label class="form-label small">Password</label><input id="authPass" type="password" class="form-control" autocomplete="current-password"></div>
        <button id="authSubmit" class="btn btn-gold w-100">Sign in</button>
        <div class="text-center mt-3"><a href="/?d=1" class="small text-secondary">Use the desktop site</a></div>
      </div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appView" class="d-none">
  <nav class="navbar sticky-top">
    <div class="container-fluid">
      <span class="navbar-brand brand mb-0">MEDI<b>ARR</b></span>
      <div class="d-flex gap-2">
        <button id="mThemeToggle" class="btn btn-outline-gold btn-sm" type="button" aria-label="Toggle light or dark mode" title="Toggle light / dark mode">
          <svg id="mThemeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
        <button class="btn btn-outline-gold btn-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <div id="autobarM" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:1080;background:var(--bg2);border:1px solid var(--gold);border-radius:.7rem;padding:.6rem .8rem;width:min(94vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.4)">
  <div class="d-flex align-items-center gap-2">
    <div class="flex-grow-1 min-w-0">
      <div class="small fw-bold text-truncate" id="abTitleM">Auto add</div>
      <div class="small text-secondary" id="abSubM"></div>
      <div style="height:4px;background:var(--bs-border-color);border-radius:2px;margin-top:4px;overflow:hidden"><div id="abFillM" style="height:100%;width:0;background:var(--gold)"></div></div>
    </div>
    <button class="btn btn-outline-secondary btn-sm" id="abStopM">Stop</button>
    <button class="btn btn-sm border-0 text-secondary" id="abHideM">&times;</button>
  </div>
</div>
<div class="container py-2">
    <div class="searchwrap">
      <div class="input-group mb-2">
        <span class="input-group-text">🔎</span>
        <input id="q" class="form-control" placeholder="Search movies & TV…" autocomplete="off">
      </div>
      <div class="btn-group seg w-100" role="group" aria-label="Search mode">
        <button class="btn btn-outline-gold active" data-mode="title">🎬 Title</button>
        <button class="btn btn-outline-gold" data-mode="person">👤 Person</button>
        <button class="btn btn-outline-gold" data-mode="year">📅 Year</button>
        <button class="btn btn-outline-gold" data-mode="studio">🏢 Studio</button>
      </div>
      <div class="form-check form-switch mt-2 mb-0">
        <input class="form-check-input" type="checkbox" id="hideAdded">
        <label class="form-check-label small text-secondary" for="hideAdded">Hide items already in my library</label>
      </div>
      <div id="kindFilter" class="btn-group btn-group-sm w-100 mt-2" role="group" aria-label="Type filter">
        <button class="btn btn-outline-secondary active" data-kind="all">All</button>
        <button class="btn btn-outline-secondary" data-kind="movie">Movies</button>
        <button class="btn btn-outline-secondary" data-kind="series">TV</button>
      </div>
    </div>
    <div id="results" class="row g-2 mt-1"></div>
    <div id="more" class="text-center my-3"></div>
  </div>
</div>

<!-- Menu offcanvas -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="menu">
  <div class="offcanvas-header"><h5 class="offcanvas-title">Menu</h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
  <div class="offcanvas-body d-flex flex-column gap-2">
    <div id="menuUser" class="small text-secondary mb-1"></div>
    <button id="mStreaming" class="btn btn-outline-gold text-start">▶️ Now streaming</button>
    <button id="mScanPlex" class="btn btn-outline-gold text-start" style="display:none">🔄 Scan Plex libraries</button>
    <button id="mDownloads" class="btn btn-outline-gold text-start" style="display:none">⬇️ Downloads</button>
    <button id="mMovies" class="btn btn-outline-gold text-start">🎬 Movies library</button>
    <button id="mShows" class="btn btn-outline-gold text-start">📺 Shows library</button>
    <button id="mCalendar" class="btn btn-outline-gold text-start">🗓️ Calendar</button>
    <button id="mUpcoming" class="btn btn-outline-gold text-start">❤️ Upcoming favorites</button>
    <button id="mPlexMe" class="btn btn-outline-gold text-start">▶️ My Plex</button>
    <button id="mQueue" class="btn btn-outline-gold text-start" style="display:none">📥 Queue</button>
    <button id="mProfile" class="btn btn-outline-gold text-start">🎨 My profile</button>
    <button id="mHealth" class="btn btn-outline-gold text-start">💓 Health</button>
    <button id="mUpdate" class="btn btn-outline-gold text-start">⬆️ System Update</button>
    <button id="mTranscodes" class="btn btn-outline-gold text-start">🎛️ Transcode Dashboard</button>
    <button id="mAdmin" class="btn btn-outline-gold text-start">👥 Admin</button>
    <button id="mSettings" class="btn btn-outline-gold text-start">⚙️ Settings</button>
    <button id="mPassword" class="btn btn-outline-gold text-start">🔑 Change password</button>
    <a id="mDonate" href="#" target="_blank" rel="noopener noreferrer" class="btn text-start" style="display:none;background:#ffc439;border-color:#ffc439;color:#003087;font-weight:800">❤️ <span id="mDonateLabel">Donate</span></a>
    <hr class="my-1">
    <a href="/?d=1" class="btn btn-outline-secondary text-start">🖥️ Desktop site</a>
    <button id="mLogout" class="btn btn-outline-secondary text-start">Log out</button>
  </div>
</div>

<!-- Detail modal -->
<div class="modal fade" id="detail" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">Details</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal fade" id="settings" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">Settings</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="settingsBody"></div>
    </div>
  </div>
</div>

<!-- Shared panel modal (Streaming / Library / Calendar / Health / Admin / Password) -->
<div class="modal fade" id="panel" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title" id="panelTitle">…</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="panelBody"></div>
    </div>
  </div>
</div>

<!-- Video player modal -->
<div class="modal fade" id="player" tabindex="-1">
  <div class="modal-dialog modal-fullscreen-sm-down modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header py-2"><h6 class="modal-title text-truncate" id="playerTitle">Playing</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <video id="mVideo" controls autoplay playsinline style="width:100%;background:#000;border-radius:8px"></video>
        <div id="mPlayerTracks" class="mt-2 d-flex flex-column gap-2"></div>
        <div id="mPlayerCtl" class="mt-2 d-flex flex-column gap-1"></div>
        <div id="mPlayerMsg" class="small text-secondary mt-2"></div>
      </div>
    </div>
  </div>
</div>

<script src="/bootstrap.bundle.min.js"></script>
<script src="/hls.min.js"></script>
<script>
const TMDB_IMG='https://image.tmdb.org/t/p/w342';
const TMDB_PROFILE='https://image.tmdb.org/t/p/w185';
const $=id=>document.getElementById(id);
// ---- light / dark theme ----
(function(){
  const root=document.documentElement, btn=$('mThemeToggle'), icon=$('mThemeIcon');
  const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const MOON='<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';
  const tc={dark:'#0c0c0f',light:'#f4f2f8'};
  function paint(){ const t=root.getAttribute('data-bs-theme')||'dark'; if(icon) icon.innerHTML=(t==='dark'?SUN:MOON); const mt=document.querySelector('meta[name=theme-color]'); if(mt) mt.setAttribute('content', tc[t]||tc.dark); }
  if(btn) btn.onclick=()=>{ const t=(root.getAttribute('data-bs-theme')==='light')?'dark':'light'; root.setAttribute('data-bs-theme',t); try{localStorage.setItem('mediarr-theme',t);}catch(e){} try{ applyThemeVarsM(t); }catch(e){} paint(); };
  paint();
})();
let me=null, config=null, mode='title', q='', searchTimer=null, homeItems=null;
let hideAdded=false, lastItems=[], lastLabel='';
let lib={ movieImdb:new Set(), movieTmdb:new Set(), seriesImdb:new Set(), seriesTvdb:new Set() };
let yearState=null, studioState=null, personState=null, homeState=null;
let kindFilter='all', pager=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function readJson(res){ let t=''; try{t=await res.text();}catch(e){} if(!t||!t.trim())return{empty:true}; try{return{data:JSON.parse(t)};}catch(e){return{bad:true};} }
async function api(path,opts){ const r=await fetch(path,opts); return r; }
function isConfigured(svc){ if(svc==='tmdb')return !!(config&&config.tmdb&&config.tmdb.hasKey); if(svc==='webdav'){const w=config&&config.webdav; if(!w)return false; return w.source==='local'?!!w.localPath:!!(w.url&&w.hasAuth);} return !!(config&&config[svc]&&config[svc].url&&config[svc].hasKey); }

/* ---------- boot ---------- */
(async()=>{
  try{ const r=await fetch('/api/me'); if(r.ok){ const j=await readJson(r); if(j.data){ me=j.data; return onAuthed(); } } }catch(e){}
  let needed=false; try{ const j=await readJson(await fetch('/api/setup-needed')); if(j.data) needed=!!j.data.needed; }catch(e){}
  showAuth(needed);
})();

function showAuth(needed){
  $('appView').classList.add('d-none'); $('authView').classList.remove('d-none');
  $('authTitle').textContent = needed ? 'Create admin account' : 'Sign in';
  $('authSubmit').textContent = needed ? 'Create account' : 'Sign in';
  $('authView').dataset.mode = needed ? 'setup' : 'login';
}
$('authSubmit').onclick = async ()=>{
  const u=$('authUser').value.trim(), p=$('authPass').value, err=$('authErr');
  err.classList.add('d-none');
  if(!u||!p){ err.textContent='Enter a username and password.'; err.classList.remove('d-none'); return; }
  const setup = $('authView').dataset.mode==='setup';
  $('authSubmit').disabled=true;
  try{
    const r=await fetch('/api/'+(setup?'setup':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const j=await readJson(r);
    if(r.ok && j.data){ me=j.data; $('authPass').value=''; onAuthed(); }
    else if(j.data&&j.data.message) throw new Error(j.data.message);
    else if(j.empty) throw new Error('No response from the server. If you use a reverse proxy, make sure it forwards /api.');
    else throw new Error('Sign-in failed ('+r.status+').');
  }catch(e){ err.textContent=e.message; err.classList.remove('d-none'); }
  $('authSubmit').disabled=false;
};

async function onAuthed(){
  $('authView').classList.add('d-none'); $('appView').classList.remove('d-none');
  $('menuUser').textContent = me ? ('Signed in as '+me.username+(me.role==='admin'?' (admin)':'')) : '';
  const adminOnly = (me&&me.role==='admin');
  ['mMovies','mShows','mUpdate','mTranscodes','mAdmin','mSettings'].forEach(id=>{ const el=$(id); if(el) el.style.display = adminOnly?'':'none'; });
  await loadConfig();
  const sp=$('mScanPlex'); if(sp) sp.style.display=(adminOnly && isConfigured('plex'))?'':'none';
  const dl=$('mDownloads'); if(dl) dl.style.display=isConfigured('webdav')?'':'none';
  { const qb=$('mQueue'); if(qb) qb.style.display=(config&&config.sab&&config.sab.url&&config.sab.hasKey)?'':'none'; }
  { const md=$('mDonate'), url=(config&&config.donate&&config.donate.url)||''; if(md){ if(url){ md.href=url; md.style.display=''; const l=$('mDonateLabel'); if(l) l.textContent=((config.donate.label||'').trim())||'Donate'; } else md.style.display='none'; } }
  await loadFavoritesM(); loadPlexSeenM(); await refreshPlexMeM();
  loadMyThemeM();
  pollAutoM();
  await loadLibrary(); showHome();
}

async function loadConfig(){ try{ const j=await readJson(await fetch('/api/config')); config=j.data||{}; }catch(e){ config={}; } }
async function fetchLibListM(svc, fresh){
  try{ const j=await readJson(await fetch('/api/library/list?svc='+svc+(fresh?'&fresh=1':''))); const d=j.data||{};
    if(d.error) console.warn('[mediarr] '+svc+': '+d.error);
    return d.items||[];
  }catch(e){ return []; }
}
async function loadLibrary(fresh){
  lib={ movieImdb:new Set(), movieTmdb:new Set(), seriesImdb:new Set(), seriesTvdb:new Set() };
  if(isConfigured('radarr')) (await fetchLibListM('radarr',fresh)).forEach(x=>{ if(x.imdbId)lib.movieImdb.add(x.imdbId); if(x.tmdbId)lib.movieTmdb.add(String(x.tmdbId)); });
  if(isConfigured('sonarr')) (await fetchLibListM('sonarr',fresh)).forEach(x=>{ if(x.imdbId)lib.seriesImdb.add(x.imdbId); if(x.tvdbId)lib.seriesTvdb.add(String(x.tvdbId)); });
}

async function findLibraryItemM(svc,it){
  const items=await fetchLibListM(svc,false);
  const imdb=String(it.imdb||'').toLowerCase(), tmdb=String(it.tmdb||'');
  return items.find(x=>(imdb&&String(x.imdbId||'').toLowerCase()===imdb)||(svc==='radarr'&&tmdb&&String(x.tmdbId||'')===tmdb))||null;
}
// Live "already added?" sets straight from Radarr/Sonarr (short server-side TTL)
const liveIdsM={ radarr:{imdb:new Set(),tmdb:new Set()}, sonarr:{imdb:new Set(),tvdb:new Set()}, at:0 };
async function refreshLiveIdsM(force){
  if(!force && Date.now()-liveIdsM.at<15000) return;
  liveIdsM.at=Date.now();
  for(const svc of ['radarr','sonarr']){
    if(!isConfigured(svc)) continue;
    try{ const j=await readJson(await fetch('/api/library/ids?svc='+svc+(force?'&fresh=1':''))); const d=j.data||{};
      liveIdsM[svc].imdb=new Set(d.imdb||[]);
      if(svc==='radarr') liveIdsM.radarr.tmdb=new Set(d.tmdb||[]); else liveIdsM.sonarr.tvdb=new Set(d.tvdb||[]);
    }catch(e){}
  }
}
// Verified tmdb -> in-library answers from the server (needed for TV, which Sonarr
// keys on imdb/tvdb rather than tmdb).
const tmdbAddedM = new Map();
const tmdbCheckedAtM = new Map();
const TMDB_NEGATIVE_TTL_M = 10000;
let tmdbRecheckTimerM = null;
function scheduleTmdbRecheckM(){
  if(tmdbRecheckTimerM) return;
  tmdbRecheckTimerM=setTimeout(()=>{
    tmdbRecheckTimerM=null;
    const items=lastItems||[];
    verifyAddedM(items).then(changed=>{ if(changed && lastItems===items) paint(); }).catch(()=>{});
  },TMDB_NEGATIVE_TTL_M+500);
}
function inLib(type, {imdb, tmdb}){
  const svc = type==='movie' ? 'radarr' : 'sonarr';
  const L = liveIdsM[svc];
  if(imdb && L.imdb.has(imdb)) return true;
  if(tmdb && L.tmdb && L.tmdb.has(String(tmdb))) return true;
  if(tmdb && tmdbAddedM.get((type==='movie'?'movie':'series')+':'+tmdb) === true) return true;
  if(type==='movie') return (imdb&&lib.movieImdb.has(imdb)) || (tmdb&&lib.movieTmdb.has(String(tmdb)));
  return (imdb&&lib.seriesImdb.has(imdb));
}
// Ask the server which of these TMDB ids are already in the library, then repaint.
async function verifyAddedM(items){
  const need=[];
  const now=Date.now();
  (items||[]).forEach(it=>{
    if(!it.tmdb) return;
    const type = it.kind==='series' ? 'series' : 'movie';
    const key = type+':'+it.tmdb;
    if(tmdbAddedM.get(key)===true) return;
    const checked=tmdbCheckedAtM.get(key)||0;
    if(tmdbAddedM.has(key) && (now-checked)<TMDB_NEGATIVE_TTL_M) return;
    need.push({ type, tmdbId:Number(it.tmdb), key });
  });
  if(!need.length) return false;
  let learned=false;
  for(let i=0;i<need.length;i+=24){
    try{
      const r=await fetch('/api/library/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:need.slice(i,i+24)})});
      if(!r.ok) continue;
      const j=await readJson(r); const added=(j.data&&j.data.added)||{};
      let hasNegative=false;
      Object.keys(added).forEach(k=>{
        if(added[k] && tmdbAddedM.get(k)!==true) learned=true;
        tmdbAddedM.set(k,!!added[k]);
        tmdbCheckedAtM.set(k,Date.now());
        if(!added[k]) hasNegative=true;
      });
      if(hasNegative) scheduleTmdbRecheckM();
    }catch(e){}
  }
  return learned;
}

function asList(d){
  if(Array.isArray(d)) return d;
  if(d && typeof d==='object'){ for(const k of ['records','items','results','data','movies','series']) if(Array.isArray(d[k])) return d[k]; }
  return [];
}
async function arr(svc,path,opts={}){
  const r=await fetch('/api/'+svc+path,opts);
  if(!r.ok){ let msg='HTTP '+r.status; try{const j=await r.json(); if(Array.isArray(j)&&j[0]&&j[0].errorMessage)msg=j[0].errorMessage; else if(j.message)msg=j.message;}catch(e){} throw new Error(msg); }
  if(r.status===204) return null; return r.json();
}

async function loadHomePages(){ if(homeState.done)return; const page=homeState.page+1;

  const [dm,dt]=await Promise.all([

    tmdb('/tv/on_the_air?page='+page).catch(()=>({results:[],total_pages:1}))
  ]);

async function loadPersonFilms(person){
  spinner('Loading '+esc(person.name)+'…');
  const cr=await tmdb('/person/'+person.id+'/combined_credits');
  const seen=new Set(); const all=[];
  (cr.cast||[]).concat(cr.crew||[]).forEach(r=>{ if(!r.poster_path)return; const k=(r.media_type)+':'+r.id; if(seen.has(k))return; seen.add(k); if(r.media_type==='movie'||r.media_type==='tv') all.push(tmdbItem(r, r.media_type==='movie'?'movie':'series')); });
  all.sort((a,b)=>(b.year||'').localeCompare(a.year||''));
  personState={ all, shown:Math.min(30, all.length) };
  pager={ hasMore:()=>personState.shown<personState.all.length, loadMore:async()=>{ personState.shown=Math.min(personState.shown+30, personState.all.length); lastItems=personState.all.slice(0,personState.shown); } };
  renderItems(all.slice(0,personState.shown), esc(person.name));
}

async function loadYearPages(){

  if(hideAdded) filtered = filtered.filter(it=>!inLib(it.kind,{imdb:it.imdb,tmdb:it.tmdb}));

  const head = lastLabel ? ('<div class="col-12"><div class="text-secondary small mb-1 mt-1">'+lastLabel+' · '+filtered.length+' shown'+(removed>0?(' · '+removed+' filtered out'):'')+'</div></div>') : '';
  if(!filtered.length){ $('results').innerHTML=head+'<div class="col-12"><div class="state">'+(lastItems.length?'Nothing matches this filter.':'Nothing found.')+'</div></div>'; }
  else { $('results').innerHTML = head + filtered.map(cardHtml).join(''); bindCards(filtered); }

const SKIN_FIELDS_M=[['bg','Background'],['bg2','Cards'],['gold','Accent'],['line','Borders'],['txt','Text'],['muted','Muted text'],['radarr','Radarr'],['sonarr','Sonarr'],['green','Success'],['red','Error']];
let myThemeM={base:'dark',modes:{dark:{},light:{}}};
function currentModeM(){
  try{ const m=localStorage.getItem('mediarr-theme'); if(m==='light'||m==='dark') return m; }catch(e){}
  return (myThemeM&&myThemeM.base==='light')?'light':'dark';
}
function applyThemeVarsM(mode){
  const root=document.documentElement;
  SKIN_FIELDS_M.forEach(([k])=>root.style.removeProperty('--'+k));
  ['--bs-body-bg','--bs-body-color','--bs-border-color'].forEach(v=>root.style.removeProperty(v));
  const v=(myThemeM&&myThemeM.modes&&myThemeM.modes[mode])||{};
  Object.keys(v).forEach(k=>{ if(v[k]) root.style.setProperty('--'+k,v[k]); });
  if(v.bg) root.style.setProperty('--bs-body-bg',v.bg);
  if(v.txt) root.style.setProperty('--bs-body-color',v.txt);
  if(v.line) root.style.setProperty('--bs-border-color',v.line);
}
function applyThemeM(t){
  if(t) myThemeM=t;
  if(myThemeM&&!myThemeM.modes) myThemeM.modes={dark:{},light:{}};
  const mode=currentModeM();
  document.documentElement.setAttribute('data-bs-theme',mode);
  applyThemeVarsM(mode);
}

function cssVarNowM(n){ return getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim(); }
function toHexM(c){ c=(c||'').trim(); if(/^#[0-9a-f]{6}$/i.test(c))return c;
  if(/^#[0-9a-f]{3}$/i.test(c))return '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  const m=/^rgba?\(([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/i.exec(c);
  if(m){const h=n=>Math.max(0,Math.min(255,Math.round(+n))).toString(16).padStart(2,'0');return '#'+h(m[1])+h(m[2])+h(m[3]);}
  return '#888888'; }

function autoDismissedM(id){ try{ return localStorage.getItem('mediarr-autoadd-dismissed')===String(id); }catch(e){ return false; } }

function renderAutoM(st){
  const bar=$('autobarM'); if(!bar) return;
  const j=(st&&st.job)||null;
  if(!j){ bar.style.display='none'; return; }
  const id=j.startedAt, running=(j.status==='running');
  // dismissed stays dismissed; finished jobs don't reappear on reload/login
  if(autoDismissedM(id) || (!running && autoWatchingM!==id)){ bar.style.display='none'; return; }
  if(running) autoWatchingM=id;
  lastAutoIdM=id;
  bar.style.display='';
  const pct=j.total?Math.round((j.index/j.total)*100):0;
  let sub=j.index+'/'+j.total+' · '+j.added+' added, '+j.skipped+' had'+(j.tooShort?', '+j.tooShort+' short':'')+', '+j.failed+' failed';
  if(j.status==='running'&&j.nextAt){ const s2=Math.max(0,Math.round((j.nextAt-Date.now())/1000)); sub+=' · next in '+(s2>=60?(Math.floor(s2/60)+'m'):(s2+'s')); }
  else if(j.status==='done') sub+=' · finished'; else if(j.status==='stopped') sub+=' · stopped';
  $('abTitleM').textContent=(j.status==='running'?'Auto adding — ':'Auto add ')+j.label;
  $('abSubM').textContent=sub; $('abFillM').style.width=pct+'%';
  $('abStopM').style.display=running?'':'none';
  if(!running){ clearTimeout(autoHideTimerM); autoHideTimerM=setTimeout(()=>dismissAutoM(id),12000); }

    const opt=(v,ic,t,n)=>'<button class="btn '+(n?'btn-outline-gold':'btn-outline-secondary')+' w-100 text-start mb-2" data-scope="'+v+'"'+(n?'':' disabled')+'>'

  const minRt=(config&&config.autoAdd&&config.autoAdd.minRuntime)||0;
  if(!confirm('Auto add '+items.length+' item(s) from "'+label+'"?\n\nOne every '+mins+' minute(s).'+(minRt?(' Skipping under '+minRt+' min.'):'')+'\nRuns on the server — you can close this page.')) return;

    const r=await fetch('/api/autoadd/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label,items})});

// ---- SABnzbd queue ----
let queueTabM='queue', queueTimerM=null;
function fmtSizeM(b){ if(!b) return ''; const u=['B','KB','MB','GB','TB']; let i=0,x=b; while(x>=1024&&i<u.length-1){x/=1024;i++;} return x.toFixed(x<10&&i>1?1:0)+' '+u[i]; }
async function openQueueM(){
  closeMenu(); openPanel('Download queue','<div class="small text-secondary">Loading…</div>');
  await loadQueueM();
  if(queueTimerM) clearInterval(queueTimerM);
  queueTimerM=setInterval(()=>{ if(!document.hidden && $('panelTitle') && /queue/i.test($('panelTitle').textContent)) loadQueueM(); }, 6000);
  $('panel').addEventListener('hidden.bs.modal', ()=>{ if(queueTimerM){ clearInterval(queueTimerM); queueTimerM=null; } }, { once:true });
}
async function loadQueueM(){
  try{
    const j=await readJson(await fetch('/api/sab?history=30')); const d=j.data||{};
    if(!d.configured){ $('panelBody').innerHTML='<div class="small text-secondary">SABnzbd isn\u2019t set up. An admin can add it in Settings.</div>'; return; }
    if(d.error){ $('panelBody').innerHTML='<div class="small text-danger">'+esc(d.error)+'</div>'; return; }
    renderQueueM(d);
  }catch(e){ $('panelBody').innerHTML='<div class="small text-danger">'+esc(e.message)+'</div>'; }
}
function renderQueueM(d){
  let h='<div class="d-flex gap-3 flex-wrap mb-2 small">'
    +'<div><div class="text-secondary" style="font-size:.6rem;text-transform:uppercase">Speed</div><b>'+esc(d.paused?'Paused':(d.speed||'0 B/s'))+'</b></div>'
    +'<div><div class="text-secondary" style="font-size:.6rem;text-transform:uppercase">Left</div><b>'+esc(d.sizeLeft||'—')+'</b></div>'
    +'<div><div class="text-secondary" style="font-size:.6rem;text-transform:uppercase">ETA</div><b>'+esc(d.timeLeft||'—')+'</b></div>'
    +(d.diskFreeGB!=null?'<div><div class="text-secondary" style="font-size:.6rem;text-transform:uppercase">Disk</div><b>'+d.diskFreeGB.toFixed(1)+' GB</b></div>':'')
    +'</div>';
  h+='<div class="btn-group btn-group-sm w-100 mb-2">'
    +'<button class="btn '+(queueTabM==='queue'?'btn-gold':'btn-outline-gold')+'" data-qtm="queue">Downloading ('+d.queue.length+')</button>'
    +'<button class="btn '+(queueTabM==='history'?'btn-gold':'btn-outline-gold')+'" data-qtm="history">Completed ('+(d.historyTotal||d.history.length)+')</button></div>';
  if(queueTabM==='queue'){
    h+= d.queue.length ? d.queue.map(q=>'<div class="py-2" style="border-bottom:1px solid var(--bs-border-color)">'
      +'<div class="small text-truncate">'+esc(q.name)+'</div>'
      +'<div class="progress mt-1" style="height:5px"><div class="progress-bar bg-warning" style="width:'+Math.max(0,Math.min(100,q.percent))+'%"></div></div>'
      +'<div class="text-secondary" style="font-size:.65rem">'+q.percent+'% · '+fmtSizeM(q.sizeMB*1048576)+(q.timeLeft?' · '+esc(q.timeLeft)+' left':'')+' · '+esc(q.status||'')+'</div></div>').join('')
      : '<div class="small text-secondary">Nothing downloading right now.</div>';
  } else {
    h+= d.history.length ? d.history.map(x=>{const failed=/fail/i.test(x.status);
      return '<div class="py-2" style="border-bottom:1px solid var(--bs-border-color)">'
      +'<div class="small text-truncate">'+esc(x.name)+'</div>'
      +'<div class="text-secondary" style="font-size:.65rem"><span class="'+(failed?'text-danger':'text-success')+'">'+esc(x.status||'')+'</span> · '+fmtSizeM(x.sizeBytes)
      +(x.completed?' · '+new Date(x.completed*1000).toLocaleDateString():'')+'</div></div>';}).join('')
      : '<div class="small text-secondary">No completed downloads yet.</div>';
  }
  $('panelBody').innerHTML=h;
  $('panelBody').querySelectorAll('[data-qtm]').forEach(b=> b.onclick=()=>{ queueTabM=b.dataset.qtm; renderQueueM(d); });
}
// ---- movie file details (same data Radarr shows) ----
function fmtBytesM(n){ if(!n) return ''; const u=['B','KB','MB','GB','TB']; let i=0,x=Number(n); while(x>=1024&&i<u.length-1){x/=1024;i++;} return x.toFixed(x<10&&i>1?2:x<100&&i>1?1:0)+' '+u[i]; }
function fmtBitrateM(n){ if(!n) return ''; return n>=1000000 ? (n/1000000).toFixed(1)+' Mbps' : Math.round(n/1000)+' kbps'; }
function chanNameM(c){ const m={1:'Mono',2:'Stereo',6:'5.1',8:'7.1'}; return m[c]||(c?c+'ch':''); }
async function loadMovieFileInfoM(it){
  const mount=$('dFileInfo'); if(!mount) return;
  mount.innerHTML='<div class="small text-secondary mt-3">Loading file details…</div>';
  try{
    const qs = it.tmdb ? ('tmdbId='+encodeURIComponent(it.tmdb)) : ('imdbId='+encodeURIComponent(it.imdb||''));
    const j=await readJson(await fetch('/api/movie/fileinfo?'+qs)); const d=j.data||{};
    if(!d.ok) throw new Error(d.message||'unavailable');
    if(!d.hasFile||!d.file){ mount.innerHTML='<div class="small text-secondary mt-3">No file on disk yet'+(d.path?' · <span style="font-family:monospace">'+esc(d.path)+'</span>':'')+'</div>'; return; }
    const f=d.file,v=f.video||{},a=f.audio||{};
    const badge=(t,cls)=> t?'<span class="badge '+(cls||'text-bg-secondary')+' me-1 mb-1">'+esc(t)+'</span>':'';
    const row=(k,val)=> val?'<div class="col-6 mb-2"><div class="text-secondary" style="font-size:.65rem;text-transform:uppercase;letter-spacing:.4px">'+k+'</div><div class="small">'+esc(String(val))+'</div></div>':'';
    const vparts=[v.codec,v.bitDepth?v.bitDepth+'-bit':'',v.fps?v.fps+' fps':'',fmtBitrateM(v.bitrate)].filter(Boolean).join(' · ');
    const aparts=[a.codec,chanNameM(a.channels),fmtBitrateM(a.bitrate),a.streams>1?a.streams+' tracks':''].filter(Boolean).join(' · ');
    mount.innerHTML='<div class="card mt-3" style="background:var(--bg2)"><div class="card-body p-2">'
      +'<div class="fw-bold small mb-2">File details</div>'
      +'<div class="mb-1">'+badge(f.quality,'text-bg-warning')+badge(v.resolution)+badge(v.dynamicRange,'text-bg-info')+badge(f.edition)+badge(f.releaseGroup)+'</div>'
      +'<div class="row g-0">'
      +row('Video',vparts)+row('Audio',aparts)
      +row('Audio languages',(a.languages||[]).join(', '))
      +row('Languages',(f.languages||[]).join(', '))
      +row('Subtitles',(f.subtitles||[]).join(', '))
      +row('Size',fmtBytesM(f.size||d.sizeOnDisk))
      +row('Runtime',f.runtime)
      +row('Added',f.dateAdded?new Date(f.dateAdded).toLocaleDateString():'')
      +'</div>'
      +(f.relativePath?'<div class="text-secondary mt-1" style="font-size:.65rem;text-transform:uppercase">Relative path</div><div class="small" style="font-family:monospace;word-break:break-all">'+esc(f.relativePath)+'</div>':'')
      +(d.path?'<div class="text-secondary mt-1" style="font-size:.65rem;text-transform:uppercase">Folder</div><div class="small" style="font-family:monospace;word-break:break-all">'+esc(d.path)+'</div>':'')
      +'</div></div>';
  }catch(e){ mount.innerHTML='<div class="small text-secondary mt-3">Couldn\u2019t load file details.</div>'; }
}
function renderTrailer(mount, key){
  if(!mount || !key) return;
  if(mount.querySelector('iframe')) return;   // don't interrupt a trailer that's already playing
  mount.innerHTML='<button class="btn btn-outline-gold w-100" id="dTrailerBtn">▶ Watch trailer</button>';
  $('dTrailerBtn').onclick=()=>{
    mount.innerHTML='<div class="ratio ratio-16x9 mt-1"><iframe src="https://www.youtube.com/embed/'+encodeURIComponent(key)+'?autoplay=1&playsinline=1&rel=0" title="Trailer" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="border:0;border-radius:8px"></iframe></div><div class="small mt-1 text-end"><a href="https://www.youtube.com/watch?v='+encodeURIComponent(key)+'" target="_blank" rel="noopener">Open in YouTube ↗</a></div>';
  };
}
function pickTrailer(videos){
  const list=(videos&&videos.results)||[];
  const yt=list.filter(v=>v.site==='YouTube');
  const pick = yt.find(v=>v.type==='Trailer'&&v.official) || yt.find(v=>v.type==='Trailer') || yt.find(v=>v.type==='Teaser'&&v.official) || yt.find(v=>v.type==='Teaser') || yt[0];
  return pick ? pick.key : null;
}

/* ---------- detail extras: cast / crew / recommendations ---------- */
function tmt(kind){ return kind==='movie'?'movie':'tv'; }
async function resolveTmdbId(it, imdb){
  if(it.tmdb) return it.tmdb;
  if(imdb && isConfigured('tmdb')){
    try{ const f=await tmdb('/find/'+encodeURIComponent(imdb)+'?external_source=imdb_id'); const list=tmt(it.kind)==='movie'?f.movie_results:f.tv_results; if(list&&list.length) return list[0].id; }catch(e){}
  }
  return null;
}
function cmNames(dir, cast, kind){
  if(!dir.length && !cast.length) return '';
  return '<div class="sec-h">Cast &amp; crew</div>'
    + (dir.length?'<div class="small mb-1"><b>'+(kind==='movie'?'Director':'Creator')+':</b> '+dir.map(esc).join(', ')+'</div>':'')
    + (cast.length?'<div class="small"><b>Cast:</b> '+cast.map(esc).join(', ')+'</div>':'')
    + '<div class="small text-secondary mt-1">Add a TMDB key in Settings to see photos and recommendations.</div>';
}
async function loadDetailExtras(it, imdb, cmDir, cmCast){
  const cred=$('dCredits'), recs=$('dRecs'); if(!cred) return;
  if(!isConfigured('tmdb')){ cred.innerHTML=cmNames(cmDir, cmCast, it.kind); return; }
  let id=null;
  try{ id=await resolveTmdbId(it, imdb); }catch(e){}
  if(!id){ cred.innerHTML=cmNames(cmDir, cmCast, it.kind); return; }
  const mt=tmt(it.kind);
  try{
    const d=await tmdb('/'+mt+'/'+id+'?append_to_response=credits,videos');
    const key=pickTrailer(d.videos); if(key) renderTrailer($('dTrailer'), key);
    const credits=d.credits||{};
    let directors=(credits.crew||[]).filter(c=>c.job==='Director');
    if(mt==='tv' && (d.created_by||[]).length) directors=d.created_by.map(c=>({id:c.id,name:c.name,profile_path:c.profile_path,job:'Creator'}));
    const seen=new Set(); directors=directors.filter(x=>{ if(seen.has(x.id))return false; seen.add(x.id); return true; });
    renderDetailCredits(cred, directors, (credits.cast||[]).slice(0,20), mt);
  }catch(e){ cred.innerHTML=cmNames(cmDir, cmCast, it.kind); }
  loadDetailRecs(recs, id, mt);
}
function pphoto(path, cls, name){ return path ? '<img class="'+cls+'" src="'+TMDB_PROFILE+path+'" loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '<div class="'+cls+'">'+esc((name||'?')[0])+'</div>'; }
function renderDetailCredits(mount, directors, cast, mt){
  let html='';
  if(directors.length){
    html+='<div class="sec-h">'+(mt==='tv'?'Created by':(directors.length>1?'Directors':'Director'))+'</div><div class="crewrow">';

async function loadDetailRecs(mount, id, mt){
  if(!mount) return;
  try{
    let data=await tmdb('/'+mt+'/'+id+'/recommendations?page=1');
    let items=(data.results||[]);
    if(items.length<4){ try{ const sim=await tmdb('/'+mt+'/'+id+'/similar?page=1'); const seen=new Set(items.map(i=>i.id)); (sim.results||[]).forEach(r=>{ if(!seen.has(r.id)){ items.push(r); seen.add(r.id); } }); }catch(e){} }
    items=items.filter(r=>r.poster_path).slice(0,14);
    if(!items.length) return;
    const recItems=items.map(r=>({ kind:mt==='movie'?'movie':'series', id:r.id, imdb:null, tmdb:r.id, title:r.title||r.name||'', year:(r.release_date||r.first_air_date||'').slice(0,4), poster:TMDB_IMG+r.poster_path }));
    let html='<div class="sec-h">'+(mt==='movie'?'Similar movies':'Similar shows')+'</div><div class="hscroll">';
    html+=recItems.map((it,i)=>'<div class="recc" data-i="'+i+'"><img class="ph4" src="'+esc(it.poster)+'" loading="lazy"><div class="nm">'+esc(it.title)+'</div><div class="rl small text-secondary">'+esc(it.year||'')+'</div></div>').join('');

/* ---------- add ---------- */
async function doAdd(btn, it, opt){
  const isMovie=it.kind==='movie'; const svc=isMovie?'radarr':'sonarr';
  if(!isConfigured(svc)){ await loadConfig(); if(!isConfigured(svc)){ openSettings(); return; } }
  btn.disabled=true; const orig=btn.textContent; btn.textContent='Adding…';
  try{
    const payload={ type:isMovie?'movie':'series', imdbId:it.imdb||'', tmdbId:it.tmdb||null, title:it.title };
    if(isMovie && opt) payload.minimumAvailability=opt;
    if(!isMovie && opt) payload.monitor=opt;
    const r=await fetch('/api/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const j2=await readJson(r); const d=j2.data||{};
    if(!r.ok || d.ok===false) throw new Error(d.message||('HTTP '+r.status));
    btn.classList.remove('btn-gold','btn-outline-gold'); btn.classList.add('btn-success');
    btn.textContent = d.alreadyInLibrary ? '✓ In library' : '✓ Added';
    if(it.tmdb){
      const k=(isMovie?'movie':'series')+':'+it.tmdb;
      tmdbAddedM.set(k,true); tmdbCheckedAtM.set(k,Date.now());
    }
    await refreshLiveIdsM(true); await loadLibrary();
    if(lastItems.length) paint();
  }catch(e){
    btn.classList.add('btn-danger');
    btn.textContent='⚠ '+(String(e.message||'').length>26?'Failed':e.message);
    btn.title=e.message||'';
    setTimeout(()=>{ btn.disabled=false; btn.textContent=orig; btn.classList.remove('btn-danger'); btn.title=''; }, 4000);
  }
}

let _mPlexServers=[], _mPlexToken='';
async function mPlexSignIn(){
  const msg=$('mPlexAuthMsg'), btn=$('mPlexSignIn'); btn.disabled=true;
  msg.className='small mt-1 text-secondary'; msg.textContent='Starting Plex sign-in…';
  let pin;
  try{ const r=await fetch('/api/admin/plex/pin',{method:'POST'}); const j=await readJson(r); pin=j.data||{}; if(!r.ok||!pin.id) throw new Error(pin.message||'Could not start sign-in'); }
  catch(e){ msg.className='small mt-1 text-danger'; msg.textContent='⚠ '+e.message; btn.disabled=false; return; }
  const w=window.open(pin.authUrl,'plexauth');
  msg.textContent='Waiting for you to sign in on Plex…';
  const start=Date.now();
  while(Date.now()-start<180000){
    await new Promise(r=>setTimeout(r,2000));
    try{ const c=(await readJson(await fetch('/api/admin/plex/check?id='+encodeURIComponent(pin.id)))).data||{}; if(c.authorized&&c.token){ _mPlexToken=c.token; break; } }catch(e){}
  }
  try{ if(w&&!w.closed) w.close(); }catch(e){}
  if(!_mPlexToken){ msg.className='small mt-1 text-danger'; msg.textContent='⚠ Sign-in timed out or cancelled.'; btn.disabled=false; return; }
  $('s_plex_key').value=_mPlexToken;
  msg.className='small mt-1 text-secondary'; msg.textContent='✓ Signed in — finding servers…';
  try{
    const d=(await readJson(await fetch('/api/admin/plex/servers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:_mPlexToken})}))).data||{};
    mFillPlexServers(d.servers||[]);
    msg.className='small mt-1 text-success';
    msg.textContent=(d.servers||[]).length?'✓ Signed in — pick your server, then Save.':'✓ Signed in, but no servers found.';
  }catch(e){ msg.className='small mt-1 text-danger'; msg.textContent='Signed in, but couldn’t list servers: '+e.message; }
  btn.disabled=false;
}
function mFillPlexServers(servers){
  _mPlexServers=servers;
  const pick=$('mPlexPick'), sel=$('mPlexServerSel'); if(!servers.length){ pick.style.display='none'; return; }

  servers.forEach((s,si)=>(s.connections||[]).forEach((c,ci)=>{ const kind=c.relay?'Relay':(c.local?'Local':'Remote'); opts.push('<option value="'+si+':'+ci+'">'+esc(s.name)+' — '+esc(c.address||'')+':'+c.port+' ('+kind+(c.protocol==='https'?', HTTPS':'')+')</option>'); if(firstLocal<0&&c.local&&!c.relay) firstLocal=idx; idx++; }));

}
function mApplyPlexServer(){

  const [si,ci]=sel.value.split(':').map(Number); const s=_mPlexServers[si]; if(!s) return; const c=s.connections[ci]; if(!c) return;

function fmtKbpsM(k){ if(!k) return ''; return k>=1000?(k/1000).toFixed(1)+' Mbps':Math.round(k)+' kbps'; }
function techRowM(t){
  if(!t) return '';
  const isTrans=/transcode/i.test(t.mode);
  const cls=isTrans?'text-bg-warning':/direct stream/i.test(t.mode)?'text-bg-info':'text-bg-success';
  const ch={1:'Mono',2:'Stereo',6:'5.1',8:'7.1'}[t.audioChannels]||(t.audioChannels?t.audioChannels+'ch':'');
  const bits=[[t.resolution,t.videoCodec,t.audioCodec,ch].filter(Boolean).join(' ')];
  if(t.streamBitrateKbps) bits.push(fmtKbpsM(t.streamBitrateKbps));
  if(isTrans&&t.transcodeTo) bits.push('→ '+t.transcodeTo);
  if(isTrans&&t.hwTranscode) bits.push('hw');
  if(isTrans&&t.speed!=null&&t.speed<1) bits.push('⚠ falling behind');
  return '<div class="mt-1"><span class="badge '+cls+'" style="font-size:.6rem">'+esc(t.mode)+'</span>'
    +'<span class="small text-secondary ms-1" style="font-family:monospace;font-size:.65rem">'+esc(bits.filter(Boolean).join(' · '))+'</span></div>';
}
function renderStreams(d){
  if(!d.configured) return panelErr('Plex isn’t set up. Add it in Settings to see who’s watching.');

    else if(s.type==='movie'){ title=esc(s.title||'Movie'); sub='Movie'+(s.year?' · '+esc(String(s.year)):''); }
    else { title=esc(s.title||'Playing'); sub=esc(s.subtitle||''); }
    const meta=['User: '+esc(s.user), s.device?esc(s.device):'', s.progress!=null?s.progress+'%':''].filter(Boolean).join(' · ');
    html+=card('<div class="fw-bold">'+title+'</div>'+(sub?'<div class="small text-secondary">'+sub+'</div>':'')+'<div class="small text-secondary">'+meta+'</div>'+techRowM(s.tech)+(s.progress!=null?'<div class="progress mt-1" style="height:5px"><div class="progress-bar bg-warning" style="width:'+s.progress+'%"></div></div>':''));

let calDays=14;
function openCalendar(){ closeMenu(); loadCalendar(); }
async function loadCalendar(){
  panelSpin('Calendar');
  await loadConfig();
  const haveR=isConfigured('radarr'), haveS=isConfigured('sonarr');
  if(!haveR&&!haveS) return panelErr('Add Radarr or Sonarr in Settings to see what’s coming up.');
  const start=dayStart(new Date()), end=new Date(start.getTime()+calDays*864e5);
  const qs='start='+start.toISOString()+'&end='+end.toISOString();
  const events=[], errs=[];
  await Promise.all([
    haveR? arr('radarr','/api/v3/calendar?unmonitored=true&'+qs).then(list=>{ (list||[]).forEach(mv=>{
      const cand=[['In Cinemas',mv.inCinemas],['Digital',mv.digitalRelease],['Physical',mv.physicalRelease]].filter(c=>c[1]).map(c=>[c[0],new Date(c[1])]).filter(c=>c[1]>=start&&c[1]<end).sort((a,b)=>a[1]-b[1]);
      if(cand.length) events.push({kind:'movie',date:cand[0][1],title:mv.title,year:mv.year,release:cand[0][0],hasFile:!!mv.hasFile,monitored:!!mv.monitored}); }); }).catch(e=>errs.push('Radarr: '+e.message)) : null,
    haveS? arr('sonarr','/api/v3/calendar?unmonitored=true&includeSeries=true&'+qs).then(list=>{ (list||[]).forEach(ep=>{
      if(!ep.airDateUtc)return; const d=new Date(ep.airDateUtc); if(d<start||d>=end)return; const s=ep.series||{};
      events.push({kind:'tv',date:d,title:s.title||'TV',se:'S'+pad(ep.seasonNumber)+'E'+pad(ep.episodeNumber),ep:ep.title||'',hasFile:!!ep.hasFile,monitored:!!ep.monitored}); }); }).catch(e=>errs.push('Sonarr: '+e.message)) : null
  ]);
  events.sort((a,b)=>a.date-b.date);
  renderCalendar(events,errs);
}
function dayLabel(d){ const t=dayStart(new Date()),one=864e5; const diff=Math.round((dayStart(d)-t)/one); if(diff===0)return'Today'; if(diff===1)return'Tomorrow'; return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }
function renderCalendar(events,errs){
  let html='<div class="btn-group btn-group-sm w-100 mb-2">'+[7,14,30].map(n=>'<button class="btn btn-outline-gold'+(n===calDays?' active':'')+'" data-d="'+n+'">'+n+' days</button>').join('')+'</div>';
  if(errs&&errs.length) html+='<div class="alert alert-warning py-1 small">'+errs.map(esc).join('<br>')+'</div>';
  if(!events.length){ html+='<div class="state">Nothing scheduled in this window.</div>'; }
  else { let last=''; events.forEach(e=>{ const dl=dayLabel(e.date); if(dl!==last){ html+='<div class="text-secondary small fw-bold mt-3 mb-1">'+dl+'</div>'; last=dl; }

    const dl2=e.hasFile?'<span class="badge text-bg-success ms-1">Downloaded</span>':'';
    const sub=e.kind==='tv'&&e.ep?'<div class="small text-secondary">'+esc(e.ep)+'</div>':'';
    const time=e.kind==='tv'?(' · '+e.date.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})):'';
    html+=card('<div class="fw-bold">'+esc(e.title)+(e.year?' ('+e.year+')':'')+'</div>'+sub+'<div class="mt-1">'+tag+dl2+'<span class="small text-secondary ms-1">'+esc(time)+'</span></div>'); }); }
  $('panelBody').innerHTML=html;

  const b=$('mUpApply'), msg=$('mUpApplyMsg'); b.disabled=true; msg.textContent='Pulling update and creating backup…';
  try{ const r=await fetch('/api/admin/update/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}), j=await readJson(r), x=j.data||{}; if(!r.ok)throw new Error(x.message||'Update failed to start'); msg.textContent='Updater launched. MEDIARR is restarting…'; await waitUpdateM(x.targetVersion||v,msg); }
  catch(e){ msg.className='small text-danger mt-2'; msg.textContent=e.message; b.disabled=false; }
}
async function waitUpdateM(target,msg){
  const until=Date.now()+180000;
  while(Date.now()<until){ await new Promise(r=>setTimeout(r,3000)); try{ const j=await readJson(await fetch('/api/admin/update',{cache:'no-store'})), d=j.data||{}; if((d.version||d.currentVersion)===target){ msg.className='small text-success mt-2'; msg.textContent='Updated to v'+target+'. Reloading…'; setTimeout(()=>location.reload(),700); return; } }catch(e){} }
  msg.className='small text-warning mt-2'; msg.textContent='Could not confirm the new version. Check Docker logs; rollback may have restored the old container.';
}

async function loadDockerM(){
  const list=$('mDkList'), msg=$('mDkMsg'); if(!list) return;

function renderDockerM(d){
  const list=$('mDkList'); if(!list) return;
  if(!d.enabled){ list.innerHTML='<div class="small text-secondary">Docker controls are disabled.</div>'; return; }
  if(!d.available){ list.innerHTML='<div class="small text-danger">'+esc(d.message||'Docker unavailable')+'</div>'; return; }
  if(!(d.containers||[]).length){ list.innerHTML='<div class="small text-secondary">'+esc(d.message||'No allowed containers found')+'</div>'; return; }
  list.innerHTML=(d.containers||[]).map(c=>{

    return '<div class="card mb-2" style="background:var(--bg)" data-mdk="'+esc(c.allowedAs||c.name)+'"><div class="card-body py-2">'
      +'<div class="d-flex justify-content-between gap-2"><div><div class="fw-bold">'+esc(c.name)+'</div><div class="small '+(running?'text-success':'text-secondary')+'">'+esc(c.status||c.state)+'</div><div class="text-secondary text-truncate" style="font-size:.68rem;max-width:65vw">'+esc(c.image||'')+'</div></div>'
      +'<span class="badge '+(running?'text-bg-success':'text-bg-secondary')+' align-self-start">'+esc(c.state||'?')+'</span></div>'
      +(c.self?'<div class="small text-warning mt-1">MEDIARR itself — controls blocked</div>':'')
      +'<div class="d-flex gap-2 mt-2"><button class="btn btn-outline-success btn-sm flex-fill" data-mdka="start" '+(running||c.self?'disabled':'')+'>▶ Start</button><button class="btn btn-outline-warning btn-sm flex-fill" data-mdka="restart" '+(c.self?'disabled':'')+'>↻ Restart</button><button class="btn btn-outline-danger btn-sm flex-fill" data-mdka="stop" '+(!running||c.self?'disabled':'')+'>■ Stop</button></div>'
      +'</div></div>';
  }).join('');
  list.querySelectorAll('[data-mdk]').forEach(row=>row.querySelectorAll('[data-mdka]').forEach(b=>b.onclick=()=>dockerActionM(row.dataset.mdk,b.dataset.mdka,b)));

async function saveDockerM(){
  const msg=$('mDkMsg'); msg.className='small align-self-center text-secondary'; msg.textContent='Saving…';
  const body={enabled:$('mDkEnabled').checked,allowedContainers:$('mDkAllowed').value.split(/\n|,|;/).map(x=>x.trim()).filter(Boolean)};
  try{
    const r=await fetch('/api/admin/docker/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}), j=await readJson(r), d=j.data||{};
    if(!r.ok) throw new Error(d.message||'Save failed');

    msg.className='small align-self-center '+(d.available?'text-success':'text-secondary'); msg.textContent=d.available?'Saved · connected':'Saved';
  }catch(e){ msg.className='small align-self-center text-danger'; msg.textContent=e.message; }

async function dockerActionM(container,action,btn){
  const verb=action[0].toUpperCase()+action.slice(1);
  if((action==='stop'||action==='restart')&&!confirm(verb+' Docker container "'+container+'"?')) return;
  const msg=$('mDkMsg'); btn.disabled=true; msg.className='small align-self-center text-secondary'; msg.textContent=verb+'ing…';
  try{
    const r=await fetch('/api/admin/docker/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({container,action})}), j=await readJson(r), d=j.data||{};
    if(!r.ok) throw new Error(d.message||'Docker action failed');
    msg.className='small align-self-center text-success'; msg.textContent=verb+' complete'; await loadDockerM();
  }catch(e){ msg.className='small align-self-center text-danger'; msg.textContent=e.message; btn.disabled=false; }
}

async function runShCommandM(id, btn){

      out.innerHTML='<div class="'+(ok?'text-success':'text-danger')+'">'+esc(c.name)+' — '+(ok?'exit 0':'exit '+(res.code===null?res.signal:res.code))+' · '+res.ms+'ms</div>'

function mLogImport(log,icon,title,msg){ const r=document.createElement('div'); r.style.borderBottom='1px solid var(--bs-border-color)'; r.innerHTML='<span class="me-1">'+icon+'</span>'+esc(title||'')+' <span class="text-secondary">'+esc(msg||'')+'</span>'; log.appendChild(r); log.scrollTop=log.scrollHeight; }
async function mRunImport(){
  const svc=_mImport.service, items=_mImport.items;
  const btn=$('mImRun'), st=$('mImStatus'), log=$('mImLog'); btn.disabled=true; log.style.display=''; log.innerHTML='';
  const qp=Number($('mImProfile').value)||1, rf=$('mImFolder').value, mon=$('mImMonitored').checked;
  let added=0,skipped=0,failed=0,done=0;
  for(const it of items){ done++; st.className='small text-secondary'; st.textContent='Importing… '+done+'/'+items.length;
    try{
      if(svc==='radarr'){
        const term=it.tmdbId?('tmdb:'+it.tmdbId):(it.imdbId?('imdb:'+it.imdbId):encodeURIComponent(it.title||''));
        const found=await arr('radarr','/api/v3/movie/lookup?term='+term); const obj=(found||[])[0];
        if(!obj){ failed++; mLogImport(log,'⚠',it.title,'not found'); continue; }
        if(obj.id){ skipped++; mLogImport(log,'•',it.title,'already in library'); continue; }
        const body=Object.assign({},obj,{qualityProfileId:qp,rootFolderPath:rf,monitored:mon,minimumAvailability:$('mImMinAvail').value,addOptions:{searchForMovie:$('mImSearch').checked}});
        await arr('radarr','/api/v3/movie',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      } else {
        const term=it.tvdbId?('tvdb:'+it.tvdbId):(it.imdbId?('imdb:'+it.imdbId):encodeURIComponent(it.title||''));
        const found=await arr('sonarr','/api/v3/series/lookup?term='+term);
        const obj=(found||[]).find(f=> it.tvdbId? f.tvdbId===it.tvdbId : (it.imdbId? f.imdbId===it.imdbId : true))||(found||[])[0];
        if(!obj){ failed++; mLogImport(log,'⚠',it.title,'not found'); continue; }
        if(obj.id){ skipped++; mLogImport(log,'•',it.title,'already in library'); continue; }
        const body=Object.assign({},obj,{qualityProfileId:qp,rootFolderPath:rf,monitored:mon,seriesType:$('mImSeriesType').value,seasonFolder:$('mImSeasonFolder').checked,addOptions:{monitor:$('mImMonitorSel').value,searchForMissingEpisodes:$('mImSearch').checked}});
        const le=$('mImLang'); if(le) body.languageProfileId=Number(le.value)||1;
        await arr('sonarr','/api/v3/series',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      }
      added++; mLogImport(log,'✓',it.title,'added');
    }catch(e){ failed++; mLogImport(log,'⚠',it.title,(e.message||'failed')); }
  }
  st.className='small text-success'; st.textContent='Done — '+added+' added, '+skipped+' skipped, '+failed+' failed'; btn.disabled=false;
  try{ loadLibrary(); }catch(e){}
}

function fmtSize(n){ if(!n)return''; const u=['B','KB','MB','GB','TB']; let i=0,x=n; while(x>=1024&&i<u.length-1){x/=1024;i++;} return x.toFixed(x<10&&i>0?1:0)+' '+u[i]; }
function openDownloads(){ closeMenu(); dlPath=''; loadDownloads(); }
async function loadDownloads(){
  panelSpin('Downloads'); await loadConfig();
  if(!isConfigured('webdav')) return panelErr('WebDAV isn’t set up. An admin can add it in Settings.');
  try{
    const r=await fetch('/api/webdav/list?path='+encodeURIComponent(dlPath)); const j=await readJson(r);
    if(!r.ok) throw new Error((j.data&&j.data.message)||('HTTP '+r.status));
    renderDownloads(j.data||{folders:[],files:[]});
  }catch(e){ panelErr('Couldn’t list files: '+e.message); }

function renderDownloads(d){
  const folders=d.folders||[], files=d.files||[];
  let html='<div class="small text-secondary mb-2">📂 /'+esc((d.path||'').split('/').filter(Boolean).join(' / '))+'</div>';
  if(dlPath) html+='<button class="btn btn-outline-secondary btn-sm mb-2" id="dlUp">⬆️ Up one level</button>';
  if(folders.length || files.length) html+='<input id="dlFilter" class="form-control form-control-sm mb-2" placeholder="Filter this folder…" autocomplete="off">';
  if(!folders.length && !files.length){ html+='<div class="state">No sub-folders or videos in this folder.</div>'; }
  folders.forEach(f=> html+='<div class="d-flex align-items-center gap-2 py-1 dlfolder dlrow" data-folder="'+esc(f.name)+'" data-name="'+esc(f.name.toLowerCase())+'" style="border-bottom:1px solid var(--bs-border-color);cursor:pointer"><span>📁</span><div class="flex-grow-1 small fw-bold text-truncate">'+esc(f.name)+'</div><span class="text-secondary">›</span></div>');
  files.forEach(f=> html+='<div class="d-flex align-items-center gap-2 py-1 dlrow" data-name="'+esc(f.name.toLowerCase())+'" style="border-bottom:1px solid var(--bs-border-color)"><span>🎬</span><div class="flex-grow-1" style="min-width:0"><div class="small fw-bold text-truncate">'+esc(f.name)+'</div><div class="small text-secondary">'+fmtSize(f.size)+'</div></div><button class="btn btn-outline-gold btn-sm" data-play="'+esc(f.name)+'">▶</button><button class="btn btn-gold btn-sm" data-dl="'+esc(f.name)+'">⬇️</button></div>');
  if(files.length) html+='<div class="small text-secondary mt-2">Each download counts toward your daily limit.</div>';
  $('panelBody').innerHTML=html;
  if($('dlUp')) $('dlUp').onclick=()=>{ const s=dlPath.split('/').filter(Boolean); s.pop(); dlPath=s.join('/'); loadDownloads(); };
  if($('dlFilter')) $('dlFilter').addEventListener('input', e=>{ const q=e.target.value.toLowerCase(); $('panelBody').querySelectorAll('.dlrow').forEach(r=>{ if((r.dataset.name||'').includes(q)) r.style.removeProperty('display'); else r.style.setProperty('display','none','important'); }); });
  $('panelBody').querySelectorAll('[data-folder]').forEach(el=> el.onclick=()=>{ dlPath=(dlPath?dlPath+'/':'')+el.dataset.folder; loadDownloads(); });
  $('panelBody').querySelectorAll('[data-play]').forEach(b=> b.onclick=()=> playVideoMobile((dlPath?dlPath+'/':'')+b.dataset.play, b.dataset.play));
  $('panelBody').querySelectorAll('[data-dl]').forEach(b=> b.onclick=()=> grabDownload((dlPath?dlPath+'/':'')+b.dataset.dl, b.dataset.dl, b));
}
let curPlayM=null, curHlsSidM=null, playLoadSeqM=0;
function stopHlsM(){ const v=$('mVideo'); if(v && v._hls){ try{ v._hls.destroy(); }catch(e){} v._hls=null; } if(curHlsSidM){ const s=curHlsSidM; curHlsSidM=null; try{ fetch('/api/webdav/hls/stop?sid='+encodeURIComponent(s)); }catch(e){} } }
let _kaTimerM=null;
function startKeepAliveM(what,path){
  stopKeepAliveM();
  const ping=()=>fetch('/api/session/keepalive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({what:what||'playing',path:path||''})}).catch(()=>{});
  ping(); _kaTimerM=setInterval(ping, 10*60*1000);
}
function stopKeepAliveM(){ if(_kaTimerM){ clearInterval(_kaTimerM); _kaTimerM=null; } }
function playVideoMobile(path, name){
  try{ panelModal().hide(); }catch(e){}   // close the downloads list so the player is in front
  startKeepAliveM('streaming', path);
  curPlayM={path,name,autoPlan:null};

      +'<div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="mTcOn"'+((config.webdav&&config.webdav.transcode)?' checked':'')+'><label class="form-check-label small" for="mTcOn">'+(auto?'Force transcode':'Transcode')+' (fixes 5.1 / AC3 / DTS / HEVC)</label></div>'
      +'<div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="mTcStereo"><label class="form-check-label small" for="mTcStereo">Downmix to stereo</label></div>'
      +'<div class="small text-secondary">'+(auto?'Automatic playback selection is on.':'Automatic playback selection is off.')+'</div>';
    $('mQualSel').onchange=loadMobileSrc; $('mTcOn').onchange=loadMobileSrc; $('mTcStereo').onchange=loadMobileSrc;
  } else { ctl.innerHTML='<div class="small text-secondary">Install ffmpeg on the server to enable transcoding, quality settings and seeking.</div>'; }
  const m=bootstrap.Modal.getOrCreateInstance($('player')); m.show();
  $('mPlayerTracks').innerHTML=''; loadTracksM(curPlayM.path);
  loadMobileSrc();
  $('player').addEventListener('hidden.bs.modal', ()=>{ const v=$('mVideo'); try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} stopHlsM(); stopKeepAliveM(); }, {once:true});
}
function audioLabelM(a){ const ch=a.channels===6?'5.1':a.channels===8?'7.1':a.channels===2?'2.0':a.channels===1?'mono':(a.channels?a.channels+'ch':''); const bits=[a.lang,ch,a.codec].filter(Boolean).join(' • '); return (a.title?a.title+(bits?' — '+bits:''):bits)||('Track '+(a.i+1)); }
function subLabelM(s){ return s.title || (s.lang?s.lang.toUpperCase():'') || ('Subtitle '+(s.i+1)); }
async function loadTracksM(path){
  const box=$('mPlayerTracks'); box.innerHTML='';
  if(!(config&&config.webdav&&config.webdav.ffmpeg)) return;
  try{
    const r=await fetch('/api/webdav/tracks?path='+encodeURIComponent(path)); if(!r.ok) return; const d=await r.json();
    if(curPlayM && curPlayM.path!==path) return;
    let html='';
    if(d.audio && d.audio.length>1){ html+='<div><label class="form-label small mb-1">Audio</label><select id="mAudioSel" class="form-select form-select-sm">'+d.audio.map(a=>'<option value="'+a.i+'">'+esc(audioLabelM(a))+'</option>').join('')+'</select></div>'; }
    const tsubs=(d.subs||[]).filter(s=>s.text);
    if(tsubs.length){ html+='<div><label class="form-label small mb-1">Subtitles</label><select id="mSubSel" class="form-select form-select-sm"><option value="">Off</option>'+tsubs.map(s=>'<option value="'+s.i+'">'+esc(subLabelM(s))+'</option>').join('')+'</select></div>'; }
    box.innerHTML=html;
    if($('mAudioSel')) $('mAudioSel').onchange=loadMobileSrc;
    if($('mSubSel')) $('mSubSel').onchange=applySubM;
  }catch(e){}
}
function applySubM(){
  const v=$('mVideo'), sS=$('mSubSel'); if(!curPlayM) return;
  [].slice.call(v.querySelectorAll('track[data-mediarr]')).forEach(t=>t.remove());
  for(let i=0;i<v.textTracks.length;i++){ v.textTracks[i].mode='disabled'; }
  if(sS && sS.value!==''){
    const tr=document.createElement('track'); tr.kind='subtitles'; tr.label=sS.options[sS.selectedIndex].text; tr.srclang='und';
    tr.src='/api/webdav/subtitle?path='+encodeURIComponent(curPlayM.path)+'&sidx='+encodeURIComponent(sS.value);
    tr.default=true; tr.setAttribute('data-mediarr','1'); v.appendChild(tr);
    const show=()=>{ try{ tr.track.mode='showing'; }catch(e){} }; tr.addEventListener('load',show); setTimeout(show,250); setTimeout(show,900);
  }
}
function playHlsM(v, url, onerr, after){
  if(window.Hls && window.Hls.isSupported()){
    if(v._hls){ try{ v._hls.destroy(); }catch(e){} }
    const hls=new Hls({ maxBufferLength:30, maxMaxBufferLength:90 }); v._hls=hls;
    hls.on(Hls.Events.ERROR,(evt,data)=>{ if(data && data.fatal) onerr(); });
    hls.loadSource(url); hls.attachMedia(v);
    v.onerror=null; const pr=v.play&&v.play(); if(pr&&pr.catch) pr.catch(()=>{}); if(after) after();
  } else if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.onerror=onerr; v.src=url; v.load(); const pr=v.play&&v.play(); if(pr&&pr.catch) pr.catch(()=>{}); if(after) after();
  } else { onerr(); }
}
async function loadMobileSrc(){
  if(!curPlayM) return;
  const seq=++playLoadSeqM;
  const v=$('mVideo'), msg=$('mPlayerMsg'), tcOn=$('mTcOn'), tcStereo=$('mTcStereo'), audioSel=$('mAudioSel'), qualSel=$('mQualSel');
  const aidx=audioSel?(parseInt(audioSel.value,10)||0):0;
  const q=qualSel?qualSel.value:'orig';
  const forced=!!((tcOn && tcOn.checked) || (tcStereo && tcStereo.checked) || aidx>0 || q!=='orig'); msg.textContent=''; stopHlsM();
  const onerr=()=>{
    if(config&&config.webdav&&config.webdav.ffmpeg&&!forced){ msg.innerHTML='Couldn’t play directly. <a href="#" id="mTcTry" class="text-warning">Transcode it</a>.'; const a=$('mTcTry'); if(a) a.onclick=(e)=>{ e.preventDefault(); if(tcOn) tcOn.checked=true; loadMobileSrc(); }; }
    else { msg.textContent='Can’t play this format in the browser. Use ⬇️ to download instead.'; }
  };
  let plan=null;
  const auto=!!(config&&config.playback&&config.playback.autoSelect&&config.webdav&&config.webdav.ffmpeg);
  if(auto&&!forced){
    msg.textContent='Selecting the best playback mode…';
    try{ if(!curPlayM.autoPlan){const r=await fetch('/api/webdav/playback-plan?path='+encodeURIComponent(curPlayM.path)),d=await r.json();if(!r.ok)throw new Error(d.message||'Playback probe failed');curPlayM.autoPlan=d;} plan=curPlayM.autoPlan;if(seq!==playLoadSeqM)return; }
    catch(e){if(seq!==playLoadSeqM)return;plan=null;}
  }
  const useHls=forced||!!(plan&&plan.mode==='hls');
  if(useHls){
    const canHls=(window.Hls && window.Hls.isSupported()) || v.canPlayType('application/vnd.apple.mpegurl');
    if(canHls){
      msg.textContent=plan&&!forced?('Auto: '+(plan.decision||'Preparing stream')+'…'):'Preparing stream…';
      let qs='path='+encodeURIComponent(curPlayM.path)+'&q='+q;if(tcStereo&&tcStereo.checked)qs+='&ac=2';if(aidx>0)qs+='&aidx='+aidx;if(plan&&!forced&&plan.forceVideo)qs+='&vc=1';
      fetch('/api/webdav/hls/start?'+qs).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{if(seq!==playLoadSeqM)return;if(!ok||!j.sid)throw new Error((j&&j.message)||'Could not start stream');curHlsSidM=j.sid;msg.textContent=plan&&!forced?('Auto: '+(plan.decision||j.mode||'HLS')):'';playHlsM(v,'/api/webdav/hls/'+j.sid+'/index.m3u8',onerr,()=>setTimeout(applySubM,500));}).catch(e=>{if(seq===playLoadSeqM)msg.textContent='Couldn’t start playback: '+e.message;});
      return;
    }
    let src='/api/webdav/stream?path='+encodeURIComponent(curPlayM.path)+'&transcode=1';if(tcStereo&&tcStereo.checked)src+='&ac=2';if(aidx>0)src+='&aidx='+aidx;if(plan&&!forced&&plan.forceVideo)src+='&vc=1';
    msg.textContent=plan&&!forced?('Auto: '+(plan.decision||'Transcode')):'';v.onerror=onerr;v.src=src;v.load();const pr=v.play&&v.play();if(pr&&pr.catch)pr.catch(()=>{});setTimeout(applySubM,300);return;
  }
  if(plan&&plan.mode==='direct')msg.textContent='Auto: Direct play';
  v.onerror=onerr;v.src='/api/webdav/stream?path='+encodeURIComponent(curPlayM.path);v.load();const pr=v.play&&v.play();if(pr&&pr.catch)pr.catch(()=>{});setTimeout(applySubM,300);
}
async function grabDownload(path, name, btn){
  const o=btn.textContent; btn.disabled=true; btn.textContent='…';
  const url='/api/webdav/download?path='+encodeURIComponent(path);
  try{
    const h=await fetch(url,{method:'HEAD'});
    if(h.status===429){ btn.textContent='Limit reached'; setTimeout(()=>{ btn.textContent=o; btn.disabled=false; },2600); return; }
    if(!h.ok){ btn.textContent='⚠'; setTimeout(()=>{ btn.textContent=o; btn.disabled=false; },2600); return; }
    const a=document.createElement('a'); a.href=url; a.download=name; if(config&&config.webdav&&config.webdav.mode!=='proxy'){ a.target='_blank'; a.rel='noopener'; } document.body.appendChild(a); a.click(); a.remove();
    btn.textContent='✓ Started'; btn.classList.remove('btn-gold'); btn.classList.add('btn-success');
    setTimeout(()=>{ btn.textContent=o; btn.disabled=false; btn.classList.remove('btn-success'); btn.classList.add('btn-gold'); },3200);
  }catch(e){ btn.textContent='⚠'; setTimeout(()=>{ btn.textContent=o; btn.disabled=false; },2600); }
}
